<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Repopolis</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root { --bg: #090c14; --card: #111726; --line: rgba(255,255,255,.08); --text: #e8ebf3; --muted: #8b94a9; --faint: #5f687d; --accent: #2f6fed; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Pretendard Variable", Pretendard, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(1200px 600px at 50% 110%, rgba(47,111,237,.18), transparent 60%), var(--bg); }
  .skyline { position: fixed; left: 0; right: 0; bottom: 0; height: 180px; display: flex; align-items: flex-end; gap: 6px; padding: 0 20px; opacity: .5; pointer-events: none; }
  .skyline i { flex: 1; background: linear-gradient(#1b2335, #121827); border-radius: 3px 3px 0 0; position: relative; }
  .skyline i::after { content: ''; position: absolute; inset: 10px 6px; background: repeating-linear-gradient(0deg, transparent 0 10px, rgba(255,210,140,.18) 10px 14px); }
  main { position: relative; width: min(520px, calc(100% - 40px)); }
  .logo { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 28px;
    background: linear-gradient(135deg, #5b7cfa, #ff8a5c); box-shadow: 0 10px 30px rgba(91,124,250,.35); }
  h1 { margin: 18px 0 4px; font-size: 30px; letter-spacing: -0.03em; }
  .sub { margin: 0 0 28px; color: var(--muted); }
  .drop { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 26px; border-radius: 16px;
    border: 1.5px dashed rgba(255,255,255,.16); background: rgba(255,255,255,.02); cursor: pointer; transition: .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: rgba(47,111,237,.08); }
  .drop b { font-size: 15px; }
  .drop span { color: var(--faint); font-size: 12.5px; }
  h2 { margin: 30px 0 10px; font-size: 12px; color: var(--muted); font-weight: 650; letter-spacing: .02em; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); cursor: pointer; }
  .item:hover { border-color: rgba(255,255,255,.18); }
  .item .ic { font-size: 18px; }
  .item .t { flex: 1; min-width: 0; }
  .item .t b { display: block; font-size: 14px; }
  .item .t span { display: block; color: var(--faint); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .x { all: unset; cursor: pointer; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; color: var(--faint); }
  .item .x:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .empty { color: var(--faint); font-size: 13px; }
  .err { margin-top: 14px; color: #ff7b7b; font-size: 13px; }
  .loading { position: fixed; inset: 0; display: none; place-items: center; background: rgba(9,12,20,.92); z-index: 5; }
  .loading.on { display: grid; }
  .loading div { text-align: center; }
  .loading b { display: block; font-size: 18px; margin-bottom: 14px; }
  .bar { width: 260px; height: 6px; border-radius: 9px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 9px; background: linear-gradient(90deg, #5b7cfa, #ff8a5c); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .loading span { display: block; margin-top: 12px; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<div class="skyline" id="skyline"></div>
<main>
  <div class="logo">🏙️</div>
  <h1>Repopolis</h1>
  <p class="sub">코드가 사는 도시. 프로젝트 폴더를 고르면 도시가 지어지고, 커밋하면 건물이 올라가요.</p>
  <div class="drop" id="drop">
    <b>📂 프로젝트 폴더 열기</b>
    <span>클릭하거나 폴더를 여기로 끌어다 놓으세요</span>
  </div>
  <div class="err" id="err" hidden></div>
  <h2>최근 프로젝트</h2>
  <div class="list" id="list"><div class="empty">아직 없어요</div></div>
</main>
<div class="loading" id="loading"><div><b id="loadingTitle">도시를 짓는 중…</b><div class="bar"><i></i></div><span>파일과 git 기록을 읽고 있어요</span></div></div>

<script>
  const cc = window.repopolis;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  $('#skyline').innerHTML = Array.from({ length: 28 }, (_, i) => `<i style="height:${30 + ((i * 37) % 110)}px"></i>`).join('');

  cc.onStatus((s) => {
    if (s.loading) { $('#loadingTitle').textContent = `🏗️ ${s.loading} 도시를 짓는 중…`; $('#loading').classList.add('on'); $('#err').hidden = true; }
    if (s.error) { $('#loading').classList.remove('on'); $('#err').textContent = s.error; $('#err').hidden = false; }
  });

  async function renderRecent() {
    const list = await cc.recent();
    if (!list.length) return;
    $('#list').innerHTML = list.map((r) => `
      <div class="item" data-root="${esc(r.root)}">
        <span class="ic">🏙️</span>
        <div class="t"><b>${esc(r.name)}</b><span>${esc(r.root)}</span></div>
        <button class="x" title="목록에서 지우기">✕</button>
      </div>`).join('');
  }
  $('#list').addEventListener('click', async (e) => {
    const item = e.target.closest('.item');
    if (!item) return;
    if (e.target.closest('.x')) { await cc.forget(item.dataset.root); item.remove(); return; }
    cc.openProject(item.dataset.root);
  });

  const drop = $('#drop');
  drop.addEventListener('click', () => cc.pickProject());
  addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  addEventListener('dragleave', () => drop.classList.remove('over'));
  addEventListener('drop', (e) => {
    e.preventDefault();
    drop.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f) cc.openProject(cc.pathOf(f));
  });
  renderRecent();
</script>
</body>
</html>
