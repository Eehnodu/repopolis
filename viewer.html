<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repopolis · __CITY_TITLE__</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root {
    --bg: #090c14;
    --panel: rgba(15, 20, 33, 0.82);
    --panel-solid: #0f1421;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);
    --text: #e8ebf3;
    --muted: #8b94a9;
    --faint: #5f687d;
    --accent: #7aa2ff;
    --claude: #ff8a5c;
    --gold: #d9b46a;
    --radius: 14px;
    --mono: Consolas, "D2Coding", "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.5 "Pretendard Variable", Pretendard, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; }
  #stage, #stage canvas { position: fixed; inset: 0; display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .label { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; padding: 3px 10px;
    border-radius: 6px; background: #1f6f4a; border: 1px solid rgba(255,255,255,.55); color: #fff;
    font-size: 12px; font-weight: 650; box-shadow: 0 2px 8px rgba(0,0,0,.3); transition: opacity .2s; }
  .label.d2 { background: #2a5d9e; font-size: 11px; padding: 2px 8px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }

  /* 상단 바 */
  #top { position: fixed; top: 14px; left: 14px; right: 14px; display: flex; align-items: center; gap: 8px; pointer-events: none; z-index: 5; }
  #top > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; height: 40px; }
  .logo { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    background: linear-gradient(135deg, #5b7cfa, #ff8a5c); font-size: 14px; }
  .brand b { font-size: 14px; letter-spacing: -0.01em; }
  .brand .proj { color: var(--muted); font-weight: 500; }
  .live { display: none; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #ff6b6b; }
  .live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .tbtn { cursor: pointer; padding: 0 13px; height: 40px; display: flex; align-items: center; gap: 6px; color: var(--text);
    font: inherit; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .tbtn:hover { border-color: var(--line-strong); background: rgba(30, 38, 58, 0.9); }
  .tbtn.on { border-color: rgba(122, 162, 255, .6); color: #cfe0ff; }
  .tbtn:disabled { opacity: .4; cursor: default; }
  .chips { display: flex; gap: 6px; margin-left: 4px; }
  .chip { padding: 0 11px; height: 32px; display: flex; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 650; margin-left: 5px; font-variant-numeric: tabular-nums; }
  .search { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 40px; width: 240px; }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; }
  .search input::placeholder { color: var(--faint); }
  .search span { color: var(--muted); font-size: 11.5px; white-space: nowrap; }

  /* 왼쪽 패널 */
  #side { position: fixed; top: 68px; left: 14px; width: 272px; max-height: calc(100% - 96px); overflow: auto; padding: 6px 0; }
  #side section { padding: 12px 16px; }
  #side section + section { border-top: 1px solid var(--line); }
  h3 { margin: 0 0 10px; font-size: 12px; font-weight: 650; color: var(--muted); letter-spacing: 0.02em; }
  h3 .sub { font-weight: 450; color: var(--faint); margin-left: 6px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; background: rgba(255, 255, 255, 0.04); border-radius: 10px; }
  .seg button { all: unset; cursor: pointer; text-align: center; padding: 7px 4px; border-radius: 7px; color: var(--muted); font-size: 12px; font-weight: 550; }
  .seg button:first-child { grid-column: 1 / -1; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: rgba(255, 255, 255, 0.1); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .seg button:disabled { opacity: .35; cursor: not-allowed; }
  #legend { margin-top: 12px; }
  .grad { height: 8px; border-radius: 99px; }
  .grad-labels { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; color: var(--muted); }
  .legend-note { margin-top: 8px; font-size: 11.5px; color: var(--faint); }
  .langs { display: flex; flex-direction: column; gap: 5px; }
  .lang { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .lang i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .lang span { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  #hot { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  #hot li { cursor: pointer; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; }
  #hot li:hover { background: rgba(255, 255, 255, 0.05); }
  #hot .row { display: flex; gap: 8px; align-items: baseline; }
  #hot .rank { color: var(--faint); font-size: 11px; width: 14px; flex: none; font-variant-numeric: tabular-nums; }
  #hot .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
  #hot .meta { margin: 1px 0 0 22px; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  /* 범례: 아이콘 | 이름 | 값 — 모든 행이 같은 열에 맞춰진다 */
  .legend { display: grid; grid-template-columns: 20px 1fr auto; column-gap: 8px; row-gap: 5px; align-items: center; font-size: 12px; }
  .legend .ic { text-align: center; font-size: 13px; line-height: 1; }
  .legend .nm { color: var(--text); font-weight: 600; }
  .legend .v { color: var(--muted); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .legend .sep { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 5px 0; }

  /* 상세 패널 */
  #detail { position: fixed; top: 68px; right: 14px; width: 330px; max-height: calc(100% - 96px); overflow: auto; padding: 18px; }
  .close { all: unset; cursor: pointer; position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 8px;
    display: grid; place-items: center; color: var(--muted); font-size: 16px; }
  .close:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 600; }
  .tag i { width: 8px; height: 8px; border-radius: 2px; }
  .wip { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 99px; background: rgba(242, 183, 5, .16); color: #f2b705; font-size: 11px; font-weight: 650; }
  .fname { margin: 6px 30px 2px 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; word-break: break-all; }
  .fpath { color: var(--faint); font-size: 11.5px; word-break: break-all; }
  .btype { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .btype b { color: var(--text); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
  .stat { padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); }
  .stat small { display: block; color: var(--muted); font-size: 11px; }
  .stat b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
  .kv span:first-child { color: var(--muted); }
  .kv span:last-child { text-align: right; }
  .meter { height: 6px; border-radius: 9px; background: #5b7cfa; overflow: hidden; margin-top: 6px; }
  .meter i { display: block; height: 100%; background: var(--claude); }
  .sect-title { margin: 18px 0 8px; font-size: 12px; font-weight: 650; color: var(--muted); }
  .commit { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12px; }
  .commit .when { color: var(--faint); flex: none; width: 52px; font-variant-numeric: tabular-nums; }
  .commit .msg { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .btns { display: flex; gap: 8px; margin-top: 18px; }
  .btn { all: unset; box-sizing: border-box; cursor: pointer; flex: 1; text-align: center; padding: 10px; border-radius: 10px; background: #2f6fed; color: #fff; font-weight: 650; }
  .btn.ghost { background: rgba(255,255,255,.08); }
  .btn:hover { filter: brightness(1.12); }

  /* 타임랩스 알약 */
  #tlpill { position: fixed; top: 66px; left: 50%; transform: translateX(-50%); width: min(640px, calc(100% - 640px)); min-width: 380px;
    display: flex; align-items: center; gap: 10px; padding: 7px 8px 9px 8px; z-index: 4; overflow: hidden; }
  #tlpill .ib { all: unset; cursor: pointer; flex: none; height: 26px; min-width: 26px; padding: 0 7px; border-radius: 8px; display: grid; place-items: center;
    background: rgba(255,255,255,.08); font-size: 11.5px; font-weight: 700; box-sizing: border-box; }
  #tlpill .ib:hover { background: rgba(255,255,255,.16); }
  #tlpill .date { flex: none; font-weight: 650; font-variant-numeric: tabular-nums; font-size: 12px; }
  #tlpill .who { flex: none; color: var(--muted); font-size: 12px; }
  #tlpill .who.ai { color: var(--claude); }
  #tlpill .subj { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c3cad9; font-size: 12px; }
  #tlpill .cnt { flex: none; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  #tlpill .bar { position: absolute; left: 10px; right: 10px; bottom: 3px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.1); }
  #tlpill .bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }

  /* 걷기 */
  #walkHud { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px;
    padding: 8px 8px 8px 16px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  kbd { display: inline-block; min-width: 20px; padding: 1px 6px; margin-right: 3px; border-radius: 5px; border: 1px solid var(--line-strong);
    border-bottom-width: 2px; background: rgba(255,255,255,.06); color: var(--text); font: 600 11px var(--mono); text-align: center; }
  #prompt { position: fixed; left: 50%; bottom: 74px; transform: translate(-50%, 8px); opacity: 0; transition: .2s; padding: 10px 16px;
    font-size: 13.5px; font-weight: 650; pointer-events: none; white-space: nowrap; }
  #prompt.on { opacity: 1; transform: translate(-50%, 0); }
  body.walking #side, body.walking #detail, body.walking #hint, body.walking .search, body.walking .chips { display: none !important; }
  body.inside #top, body.inside #side, body.inside #detail, body.inside #hint, body.inside #labels,
  body.inside #tlpill, body.inside #walkHud, body.inside #prompt, body.inside #tip { display: none !important; }
  #fade { position: fixed; inset: 0; background: #07090f; opacity: 0; pointer-events: none; transition: opacity .38s ease; z-index: 60; }

  #tip { position: fixed; pointer-events: none; z-index: 10; padding: 8px 11px; border-radius: 10px; background: var(--panel-solid);
    border: 1px solid var(--line-strong); font-size: 12px; max-width: 340px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
  #tip b { display: block; font-size: 13px; }
  #tip .p { color: var(--faint); font-size: 11px; word-break: break-all; }
  #tip .m { color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  #toast { position: fixed; left: 50%; top: 116px; transform: translate(-50%, -12px); opacity: 0; transition: .35s; padding: 10px 16px; z-index: 6;
    font-weight: 650; pointer-events: none; max-width: min(640px, calc(100% - 40px)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #hint { position: fixed; right: 18px; bottom: 16px; color: rgba(255,255,255,.6); font-size: 11.5px; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }

  /* ───── 건물 안 ───── */
  #inside { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
  #inside > * { pointer-events: auto; }
  .in-top { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 10px; pointer-events: none !important; }
  .in-top > * { pointer-events: auto; }
  .plate, .in-btn { background: rgba(26, 18, 12, .82); border: 1px solid rgba(217, 180, 106, .38); border-radius: 14px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .plate { display: flex; align-items: center; gap: 12px; padding: 0 18px 0 12px; height: 46px; }
  .plate .ic { font-size: 22px; }
  .plate b { font-size: 16px; color: #f6e7c8; letter-spacing: -0.01em; }
  .plate span { color: #c9b48a; font-size: 12px; }
  .in-btns { margin-left: auto; display: flex; gap: 8px; }
  .in-btn { cursor: pointer; height: 46px; padding: 0 16px; color: #f6e7c8; font: inherit; font-weight: 650; }
  .in-btn:hover { border-color: rgba(217, 180, 106, .75); }
  .board { position: fixed; top: 76px; left: 16px; bottom: 16px; width: 340px; overflow: auto; padding: 18px 18px 22px; border-radius: 16px;
    background: linear-gradient(180deg, rgba(48, 32, 22, .94), rgba(28, 19, 13, .94)); border: 1px solid rgba(217, 180, 106, .42);
    box-shadow: inset 0 1px 0 rgba(255, 235, 190, .1), 0 24px 60px rgba(0,0,0,.5); color: #f1e3c4; }
  .board h4 { margin: 0 0 8px; font-size: 10.5px; letter-spacing: .2em; color: var(--gold); font-weight: 750; }
  .board h4 + h4 { margin-top: 0; }
  .board .sec + .sec { margin-top: 20px; }
  .intro { padding: 12px 14px; border-radius: 10px; background: rgba(0,0,0,.24); border-left: 3px solid var(--gold);
    font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; color: #f0e4c9; }
  .intro.auto { color: #cdb98f; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .facts div { padding: 7px 8px; border-radius: 8px; background: rgba(0,0,0,.2); text-align: center; }
  .facts b { display: block; font-size: 15px; color: #f6e7c8; font-variant-numeric: tabular-nums; }
  .facts small { color: #a58f63; font-size: 10.5px; }
  .floors .fl { display: flex; gap: 10px; padding: 6px 0; border-top: 1px dashed rgba(217, 180, 106, .2); }
  .floors .fb { flex: none; width: 42px; height: 24px; margin-top: 1px; border-radius: 6px; display: grid; place-items: center;
    background: linear-gradient(#ecd08e, #b48c3c); color: #2a1d14; font-weight: 800; font-size: 11.5px; font-variant-numeric: tabular-nums; transition: .2s; }
  .floors .fl.on .fb { box-shadow: 0 0 0 2px #fff3c9, 0 0 16px rgba(255, 214, 120, .65); }
  .floors .items { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .it, .lk { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 7px; align-items: baseline; padding: 2px 6px; border-radius: 6px;
    font: 12px/1.65 var(--mono); color: #f6ead0; min-width: 0; }
  .it:hover, .lk:hover { background: rgba(217, 180, 106, .16); }
  .it i, .lk i { font-style: normal; color: var(--gold); width: 14px; text-align: center; flex: none; }
  .it span, .lk span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .it.d1 { padding-left: 18px; color: #d8c8a4; }
  .it small, .lk small { margin-left: auto; padding-left: 8px; color: #9c875e; font-size: 10.5px; flex: none; }
  .lk { font-family: inherit; font-size: 12.5px; }
  .more { color: #9c875e; font-size: 11.5px; padding: 2px 6px; }
  .monitor { position: fixed; top: 76px; right: 16px; bottom: 16px; width: min(900px, 56vw); display: flex; flex-direction: column;
    border-radius: 16px; background: #0d1117; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 0 0 6px #05070b, 0 30px 70px rgba(0,0,0,.55); overflow: hidden; }
  .mon-head { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 42px; flex: none; background: #161b22;
    border-bottom: 1px solid rgba(255,255,255,.07); font-size: 12.5px; color: #c9d1d9; }
  .mon-head .dots { display: flex; gap: 6px; }
  .mon-head .dots i { width: 10px; height: 10px; border-radius: 50%; }
  .mon-head .fn { font-family: var(--mono); }
  .mon-head .ln { color: #6e7681; }
  .elev { margin-left: auto; padding: 3px 10px; border-radius: 6px; background: #170707; color: #ff5a3c; border: 1px solid #3a1010;
    font: 700 13px var(--mono); letter-spacing: .08em; text-shadow: 0 0 8px rgba(255, 80, 50, .75); }
  .scroller { flex: 1; overflow: auto; position: relative; }
  .code { display: flex; min-width: 100%; width: max-content; position: relative; }
  .code pre { margin: 0; padding: 12px 0; font: 12.5px/20px var(--mono); tab-size: 4; }
  .gutter { position: sticky; left: 0; z-index: 2; padding: 12px 12px 12px 14px !important; text-align: right; color: #4b5563;
    background: #0d1117; user-select: none; border-right: 1px solid rgba(255,255,255,.05); }
  .src { padding: 12px 28px 12px 16px !important; color: #c9d1d9; background: transparent !important; }
  .src.hljs { padding: 12px 28px 12px 16px !important; }
  .hl { position: absolute; left: 0; right: 0; height: 20px; background: rgba(255, 214, 120, .16); border-left: 3px solid #ffd27a; pointer-events: none; animation: hlfade 2.6s forwards; z-index: 1; }
  @keyframes hlfade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
  .empty-code { padding: 40px; color: #6e7681; text-align: center; }
  ::-webkit-scrollbar { width: 9px; height: 9px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 9px; }
  ::-webkit-scrollbar-corner { background: transparent; }
  .board::-webkit-scrollbar-thumb { background: rgba(217, 180, 106, .25); }
  @media (max-width: 1400px) { #hint { display: none; } .chips { display: none; } }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
</head>
<body>
<div id="boot">도시를 짓는 중…</div>
<div id="stage"></div>
<div id="labels"></div>

<header id="top">
  <div class="brand panel"><span class="logo">🏙️</span><b>Repopolis</b><span class="proj">__CITY_TITLE__</span><span class="live" id="live">LIVE</span></div>
  <button class="tbtn panel" id="projectBtn" hidden>📂 프로젝트</button>
  <button class="tbtn panel" id="walkBtn" title="도시를 걸어다니기">🚶 걸어보기</button>
  <button class="tbtn panel" id="tlBtn" title="첫 커밋부터 도시가 지어지는 과정 (Space)" hidden>🎬 타임랩스</button>
  <button class="tbtn panel" id="skyBtn" title="낮/밤 (N)"></button>
  <div class="chips" id="stats"></div>
  <label class="search panel">
    <span>🔍</span><input id="q" placeholder="파일 찾기" autocomplete="off" spellcheck="false"><span id="qcount">/</span>
  </label>
</header>

<aside id="side" class="panel">
  <section>
    <h3>색칠 기준</h3>
    <div class="seg" id="modes"></div>
    <div id="legend"></div>
  </section>
  <section>
    <h3>🚨 재개발 후보<span class="sub">길고 자주 고친 파일</span></h3>
    <ol id="hot"></ol>
  </section>
  <section><div class="legend" id="howto"></div></section>
</aside>

<aside id="detail" class="panel" hidden></aside>

<div id="tlpill" class="panel" hidden>
  <button class="ib" id="tlStop" title="멈추기 (Space)">■</button>
  <span class="date" id="tlDate"></span>
  <span class="who" id="tlWho"></span>
  <span class="subj" id="tlSubj"></span>
  <span class="cnt" id="tlCnt"></span>
  <button class="ib" id="tlSpeed" title="속도">1×</button>
  <div class="bar"><i id="tlBar"></i></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const DATA = "__CITY_DATA__";

const $ = (s) => document.querySelector(s);
const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clamp01 = (v) => clamp(v, 0, 1);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const NOW = DATA.generatedAt;
const COMMITS = DATA.commits; // [hash, ts, authorIdx, subject, claude, touchedHere, touchedTotal]
const N = COMMITS.length;
const HAS_GIT = DATA.git && N > 0;
const BRIDGE = window.repopolis; // 데스크톱 앱에서만 존재
const store = {
  get(k) { try { return sessionStorage.getItem(k) ?? localStorage.getItem(k); } catch { return null; } },
  set(k, v, session) { try { (session ? sessionStorage : localStorage).setItem(k, v); } catch {} },
};

// 결정적 난수 — 같은 프로젝트는 매번 같은 모습
function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
}
const pickOf = (arr, i) => arr[((i * 2654435761) >>> 0) % arr.length];

function ago(ts) {
  const d = (NOW - ts) / 86400;
  if (d < 1) return '오늘';
  if (d < 2) return '어제';
  if (d < 30) return `${Math.floor(d)}일 전`;
  if (d < 365) return `${Math.floor(d / 30)}개월 전`;
  return `${(d / 365).toFixed(1)}년 전`;
}
function ymd(ts, withTime) {
  const d = new Date(ts * 1000), p = (n) => String(n).padStart(2, '0');
  const s = `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}`;
  return withTime ? `${s} ${p(d.getHours())}:${p(d.getMinutes())}` : s;
}
function percentile(values, q) {
  const s = values.filter((v) => v > 0).sort((a, b) => a - b);
  return s.length ? s[Math.min(s.length - 1, Math.floor(q * s.length))] : 1;
}

// ───────────────────────── 데이터 → 트리 ─────────────────────────
const files = DATA.files.map((f, i) => {
  const n = f.tl.length / 2, tlIdx = new Int32Array(n), tlVal = new Int32Array(n);
  for (let k = 0; k < n; k++) { tlIdx[k] = f.tl[2 * k]; tlVal[k] = f.tl[2 * k + 1]; }
  return { ...f, i, name: f.p.split('/').pop(), tlIdx, tlVal, curType: -1, dep: f.dep || [] };
});
const usedBy = files.map(() => []);
for (const f of files) for (const j of f.dep) usedBy[j].push(f.i);

const root = { name: DATA.name, path: '', dirs: new Map(), files: [], depth: 0 };
for (const f of files) {
  const parts = f.p.split('/');
  let node = root;
  for (let k = 0; k < parts.length - 1; k++) {
    let next = node.dirs.get(parts[k]);
    if (!next) {
      next = { name: parts[k], path: parts.slice(0, k + 1).join('/'), dirs: new Map(), files: [], depth: node.depth + 1 };
      node.dirs.set(parts[k], next);
    }
    node = next;
  }
  node.files.push(f);
}

// ───────────────────────── 건물 종류 ─────────────────────────
const FLOOR = 0.9;  // 한 층 높이
const GAP = 1.3;    // 마당
const TYPES = [
  { key: 'house', name: '주택', icon: '🏠', max: 80, side: 1.9 },
  { key: 'villa', name: '빌라', icon: '🏘️', max: 250, side: 2.5 },
  { key: 'apt', name: '아파트', icon: '🏢', max: 600, side: 2.3, long: 4.6 },
  { key: 'office', name: '오피스', icon: '🏬', max: 1200, side: 3.3 },
  { key: 'tower', name: '마천루', icon: '🏙️', max: Infinity, side: 4.2 },
];
const typeOf = (l) => TYPES.findIndex((t) => l < t.max);
const floorsFor = (l) => (l < 25 ? 1 : l < 80 ? 2 : Math.max(3, Math.round(Math.sqrt(l) * 0.55 - 1)));
function baseDims(f, t) {
  const extra = Math.min(0.8, Math.sqrt(f.fn) * 0.1), T = TYPES[t];
  return T.long ? [T.long + extra, T.side + extra * 0.5] : [T.side + extra, T.side + extra];
}
function dimsFor(f, t) {
  let [a, b] = baseDims(f, t);
  if (a !== b && f.cell.h > f.cell.w) [a, b] = [b, a]; // 아파트는 땅의 긴 방향으로
  return [Math.max(0.6, Math.min(a, f.cell.w - 0.9)), Math.max(0.6, Math.min(b, f.cell.h - 0.9))];
}

// ───────────────────────── 배치 (squarified treemap) ─────────────────────────
// INSET: 구역 둘레 도로 폭의 절반 / PAD: 구역 안쪽 여백
const INSET = (d) => (d === 0 ? 0 : d === 1 ? 1.7 : d === 2 ? 1.0 : 0.35);
const PAD = (d) => (d === 0 ? 2.4 : INSET(d) + 0.55);
const topY = (d) => 0.1 + d * 0.08;

function weigh(node) {
  let sum = 0;
  node.count = node.files.length;
  node.lines = 0;
  for (const f of node.files) {
    const [a, b] = baseDims(f, typeOf(f.l));
    f.w = (a + GAP) * (b + GAP);
    sum += f.w;
    node.lines += f.l;
  }
  for (const d of node.dirs.values()) {
    sum += weigh(d);
    node.count += d.count;
    node.lines += d.lines;
  }
  node.w = (Math.sqrt(sum) + PAD(node.depth) * 2) ** 2;
  return node.w;
}

function squarify(items, rect) {
  const out = new Array(items.length);
  const total = items.reduce((s, it) => s + it.w, 0);
  const scale = (rect.w * rect.h) / total;
  const order = items.map((it, i) => ({ i, a: it.w * scale })).sort((a, b) => b.a - a.a);
  let { x, y, w, h } = rect;
  const worst = (row, len) => {
    let s = 0, mx = 0, mn = Infinity;
    for (const r of row) { s += r.a; mx = Math.max(mx, r.a); mn = Math.min(mn, r.a); }
    return Math.max((len * len * mx) / (s * s), (s * s) / (len * len * mn));
  };
  const place = (row) => {
    const s = row.reduce((t, r) => t + r.a, 0);
    if (w >= h) {
      const cw = s / h;
      let cy = y;
      for (const r of row) { const rh = r.a / cw; out[r.i] = { x, y: cy, w: cw, h: rh }; cy += rh; }
      x += cw; w -= cw;
    } else {
      const rh = s / w;
      let cx = x;
      for (const r of row) { const rw = r.a / rh; out[r.i] = { x: cx, y, w: rw, h: rh }; cx += rw; }
      y += rh; h -= rh;
    }
  };
  let row = [];
  for (const it of order) {
    const len = Math.min(w, h);
    if (!row.length || worst([...row, it], len) <= worst(row, len)) row.push(it);
    else { place(row); row = [it]; }
  }
  if (row.length) place(row);
  return out;
}

const districts = [];
function layout(node, rect, anc) {
  node.di = districts.length;
  const ins = INSET(node.depth);
  districts.push({ node, ...rect, depth: node.depth, vis: { x: rect.x + ins, y: rect.y + ins, w: rect.w - ins * 2, h: rect.h - ins * 2 } });
  const chain = [...anc, node.di];
  const pad = PAD(node.depth);
  const inner = { x: rect.x + pad, y: rect.y + pad, w: Math.max(0.01, rect.w - pad * 2), h: Math.max(0.01, rect.h - pad * 2) };
  const items = [...node.dirs.values(), ...node.files];
  const rects = squarify(items, inner);
  items.forEach((it, k) => {
    const r = rects[k];
    if (it.dirs) { layout(it, r, chain); return; }
    it.cell = r;
    it.x = r.x + r.w / 2;
    it.z = r.y + r.h / 2;
    it.surface = topY(node.depth);
    it.baseY = it.surface + 0.05;
    it.anc = chain;
  });
}

weigh(root);
const S = Math.sqrt(root.w); // 도시 한 변
layout(root, { x: -S / 2, y: -S / 2, w: S, h: S }, []);

// 걷기 충돌·바닥 높이 계산용 격자
const GRID = 8;
const grid = new Map();
for (const f of files) {
  const key = `${Math.floor(f.x / GRID)},${Math.floor(f.z / GRID)}`;
  if (!grid.has(key)) grid.set(key, []);
  grid.get(key).push(f);
}
function nearby(x, z) {
  const gx = Math.floor(x / GRID), gz = Math.floor(z / GRID), out = [];
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) { const c = grid.get(`${gx + a},${gz + b}`); if (c) out.push(...c); }
  return out;
}

// ───────────────────────── 장면 ─────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('#stage').appendChild(renderer.domElement);
$('#boot').remove();

const scene = new THREE.Scene();
scene.background = new THREE.Color();
scene.fog = new THREE.Fog(0xffffff, S * 1.5, S * 4.2);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, S * 30);
camera.position.set(S * 0.55, S * 0.55, S * 0.85);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 3;
controls.maxDistance = S * 4;
const camTarget = new THREE.Vector3(); // 카메라가 바라보는 점 (모든 모드 공통)

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0, 0.5, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const hemi = new THREE.HemisphereLight('#ffffff', '#6d7a5a', 1.2);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff3dd', 2.4);
sun.position.set(S * 0.55, S * 1.1, S * 0.35);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -S * 0.75, right: S * 0.75, top: S * 0.75, bottom: -S * 0.75, near: 1, far: S * 4 });
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const ZERO = new THREE.Matrix4().makeScale(0, 0, 0);
const dummy = new THREE.Object3D();
const WHITE = new THREE.Color('#ffffff');
const C = (hex) => new THREE.Color(hex);

const box = new THREE.BoxGeometry(1, 1, 1);
box.translate(0, 0.5, 0);
const roofGeo = (() => {
  const shape = new THREE.Shape([new THREE.Vector2(-0.5, 0), new THREE.Vector2(0.5, 0), new THREE.Vector2(0, 1)]);
  const g = new THREE.ExtrudeGeometry(shape, { depth: 1, bevelEnabled: false });
  g.translate(0, 0, -0.5);
  return g;
})();

function inst(geo, mat, count, { cast = true, receive = true } = {}) {
  const m = new THREE.InstancedMesh(geo, mat, Math.max(1, count));
  m.castShadow = cast;
  m.receiveShadow = receive;
  m.frustumCulled = false;
  m.boundingSphere = new THREE.Sphere(new THREE.Vector3(), S * 3);
  for (let i = 0; i < m.count; i++) { m.setMatrixAt(i, ZERO); m.setColorAt(i, WHITE); }
  scene.add(m);
  return m;
}
function put(mesh, idx, x, y, z, sx, sy, sz, rot = 0) {
  dummy.position.set(x, y, z);
  dummy.rotation.set(0, rot, 0);
  dummy.scale.set(sx, sy, sz);
  dummy.updateMatrix();
  mesh.setMatrixAt(idx, dummy.matrix);
}

// 창문이 있는 외벽 — 층마다 창을 그리고, 밤에는 일부가 켜졌다 꺼졌다 한다
const U = { uNight: { value: 0 }, uTime: { value: 0 } };
const facadeMat = new THREE.MeshStandardMaterial({ roughness: 0.62, metalness: 0.1 });
facadeMat.onBeforeCompile = (sh) => {
  sh.uniforms.uNight = U.uNight;
  sh.uniforms.uTime = U.uTime;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vWin; varying vec3 vWinN; varying vec2 vSeed;')
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      vec3 sc = vec3(length(instanceMatrix[0].xyz), length(instanceMatrix[1].xyz), length(instanceMatrix[2].xyz));
      vWin = vec3(position.x * sc.x, position.y * sc.y + instanceMatrix[3].y, position.z * sc.z);
      vWinN = normal;
      vSeed = instanceMatrix[3].xz;`);
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      uniform float uNight; uniform float uTime;
      varying vec3 vWin; varying vec3 vWinN; varying vec2 vSeed;
      float wHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      totalEmissiveRadiance += diffuseColor.rgb * 0.07 * uNight;
      if (abs(vWinN.y) < 0.5) {
        float u = abs(vWinN.x) > 0.5 ? vWin.z : vWin.x;
        float gu = u / 0.72 + 0.5;
        float gv = (vWin.y - 0.15) / ${FLOOR.toFixed(2)};
        vec2 cell = floor(vec2(gu, gv));
        float fx = fract(gu), fy = fract(gv);
        float win = step(0.24, fx) * step(fx, 0.76) * step(0.3, fy) * step(fy, 0.8);
        vec2 key = cell + vSeed * 1.37 + vWinN.xz * 7.0;
        float lit = step(0.5, wHash(key + floor(uTime * 0.035 + wHash(key) * 10.0)));
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.17, 0.24, 0.32), win * 0.75);
        totalEmissiveRadiance += win * lit * uNight * vec3(1.0, 0.76, 0.45) * 1.6;
      }`);
};
const plainMat = new THREE.MeshStandardMaterial({ roughness: 0.85 });
const roofMat = new THREE.MeshStandardMaterial({ roughness: 0.75, flatShading: true });
const metalMat = new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.7 });
const groundMat = new THREE.MeshStandardMaterial({ roughness: 0.95 });

// 땅
const ground = new THREE.Mesh(new THREE.CircleGeometry(S * 4, 64), new THREE.MeshStandardMaterial({ color: '#7ea35f', roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 구역 바닥: 0단 = 큰길(아스팔트), 1단 = 골목, 그 안쪽 = 보도
const DIST_COLORS = ['#3a3f48', '#4b515b', '#bdb7aa', '#c8c2b5', '#b2ac9f'].map(C);
const distMesh = inst(box, groundMat, districts.length, { cast: false });
const distVisible = new Uint8Array(districts.length).fill(1);
function writeDistricts() {
  districts.forEach((d, k) => {
    const v = d.vis;
    if (!distVisible[k] || v.w <= 0 || v.h <= 0) { distMesh.setMatrixAt(k, ZERO); return; }
    put(distMesh, k, v.x + v.w / 2, topY(d.depth) - 0.1, v.y + v.h / 2, v.w, 0.1, v.h);
  });
  distMesh.instanceMatrix.needsUpdate = true;
}
writeDistricts();

// 필지 (파일마다 한 칸) + 마당 나무
const LOT = { grass: C('#8dbb64'), pave: C('#d6d0c3'), work: C('#d8a24a') };
const lotMesh = inst(box, groundMat, files.length, { cast: false });
for (const f of files) {
  put(lotMesh, f.i, f.x, f.surface, f.z, Math.max(0.2, f.cell.w - 0.35), 0.05, Math.max(0.2, f.cell.h - 0.35));
  lotMesh.setColorAt(f.i, f.wip ? LOT.work : typeOf(f.l) === 0 ? LOT.grass : LOT.pave);
}

const treeSpots = [];
const rand = rng(files.length * 7919 + N);
for (const f of files) {
  const [w, d] = dimsFor(f, typeOf(f.l));
  const freeX = f.cell.w - w, freeZ = f.cell.h - d;
  if (Math.max(freeX, freeZ) < 1.5) continue;
  if (freeX >= freeZ) treeSpots.push([f.x + (f.cell.w / 2 - freeX / 4) * (rand() < 0.5 ? 1 : -1), f.baseY, f.z + (rand() - 0.5) * d * 0.6, 0.7 + rand() * 0.5]);
  else treeSpots.push([f.x + (rand() - 0.5) * w * 0.6, f.baseY, f.z + (f.cell.h / 2 - freeZ / 4) * (rand() < 0.5 ? 1 : -1), 0.7 + rand() * 0.5]);
}
for (let k = 0, n = Math.floor(S / 3.2); k < n * 4; k++) { // 도시 외곽 가로수
  const s = (k / (n * 4)) * 4, side = Math.floor(s), t = (s - side) * S - S / 2, o = S / 2 + 1.6;
  const [x, z] = [[t, -o], [o, t], [-t, o], [-o, -t]][side];
  treeSpots.push([x, 0, z, 0.8 + rand() * 0.6]);
}
const trunkMesh = inst(new THREE.CylinderGeometry(0.09, 0.12, 1, 6).translate(0, 0.5, 0), plainMat, treeSpots.length);
const leafMesh = inst(new THREE.IcosahedronGeometry(1, 0), roofMat, treeSpots.length);
const LEAVES = ['#4f8a3c', '#5c9a45', '#3f7a35', '#6aa34f', '#7aa83f'].map(C);
treeSpots.forEach(([x, y, z, s], k) => {
  put(trunkMesh, k, x, y, z, s, 0.7 * s, s);
  trunkMesh.setColorAt(k, C('#6b4a32'));
  put(leafMesh, k, x, y + 1.05 * s, z, 0.55 * s, 0.65 * s, 0.55 * s, k);
  leafMesh.setColorAt(k, LEAVES[k % LEAVES.length]);
});

// 도로: 1단 구역 둘레가 큰길, 2단 구역 둘레가 골목
function onRing(r, s, lateral) {
  const { x, y: z, w, h } = r;
  let px, pz, tx, tz, nx, nz;
  if (s < w) { px = x + s; pz = z; tx = 1; tz = 0; nx = 0; nz = 1; }
  else if ((s -= w) < h) { px = x + w; pz = z + s; tx = 0; tz = 1; nx = -1; nz = 0; }
  else if ((s -= h) < w) { px = x + w - s; pz = z + h; tx = -1; tz = 0; nx = 0; nz = -1; }
  else { s -= w; px = x; pz = z + h - s; tx = 0; tz = -1; nx = 1; nz = 0; }
  return [px + nx * lateral, pz + nz * lateral, tx, tz];
}
const roads = districts.filter((d) => d.depth === 1 || d.depth === 2).map((d) => ({
  x: d.x, y: d.y, w: d.w, h: d.h, len: 2 * (d.w + d.h), lvl: topY(d.depth - 1), main: d.depth === 1,
}));
const walks = districts.filter((d) => d.depth >= 2 && d.vis.w > 1 && d.vis.h > 1).map((d) => ({
  x: d.vis.x - 0.3, y: d.vis.y - 0.3, w: d.vis.w + 0.6, h: d.vis.h + 0.6, len: 2 * (d.vis.w + d.vis.h + 1.2), lvl: topY(d.depth - 1),
}));

// 차선
const dashes = [];
for (const r of roads.filter((r) => r.main)) for (let s = 0.5; s < r.len; s += 2.4) dashes.push([r, s]);

function placeBuilding(f, l) {
  const i = f.i;
  for (let k = 0; k < 3; k++) facade.setMatrixAt(i * 3 + k, ZERO);
  for (let k = 0; k < 2; k++) plain.setMatrixAt(i * 2 + k, ZERO);
  roofs.setMatrixAt(i, ZERO);
  spires.setMatrixAt(i, ZERO);
  beacons.setMatrixAt(i, ZERO);
  const t = l >= 1 ? typeOf(l) : -1;
  if (t !== f.curType) { f.curType = t; colorsDirty = true; }
  if (t < 0) { f.box = null; return; }
  const h = floorsFor(l) * FLOOR, { x, z, baseY: y } = f;
  const [w, d] = dimsFor(f, t);
  let top = h;
  switch (TYPES[t].key) {
    case 'house': {
      put(facade, i * 3, x, y, z, w, h, d);
      const rh = 0.55 + Math.min(w, d) * 0.22, alongX = w > d;
      put(roofs, i, x, y + h, z, (alongX ? d : w) * 1.14, rh, (alongX ? w : d) * 1.14, alongX ? Math.PI / 2 : 0);
      top = h + rh;

    }
    case 'villa':
      put(facade, i * 3, x, y, z, w, h, d);
      put(plain, i * 2, x + w * 0.2, y + h, z - d * 0.2, w * 0.34, FLOOR * 0.85, d * 0.34);
      put(plain, i * 2 + 1, x - w * 0.22, y + h, z + d * 0.22, 0.5, 0.35, 0.5);

      put(facade, i * 3, x, y, z, w, h, d);
      put(plain, i * 2, x, y + h, z, w * 1.03, 0.32, d * 1.03);

      put(plain, i * 2 + 1, x + (w > d ? w * 0.3 : 0), y + h + 0.32, z + (w > d ? 0 : d * 0.3), m, 0.65, m);

      put(plain, i * 2, x, y + h, z, w * 0.6, 0.4, d * 0.6);

function lastEntry(f, i) {
  let lo = 0, hi = f.tlIdx.length - 1, ans = -1;
  while (lo <= hi) {

    if (f.tlIdx[m] <= i) { ans = m; lo = m + 1; } else hi = m - 1;
  }
  return ans;
}

const ROLES = {
  house: { facade: ['wall'], plain: [], roof: 'roof' },
  villa: { facade: ['body'], plain: ['concrete', 'concrete'] },

function roleColor(f, role, key) {
  const m = MODES[state.color].color;
  if (role === 'concrete') return P.concrete;
  if (role === 'metal') return P.metal;
  if (!m) {
    if (role === 'wall') return pickOf(P.wall, f.i);
    if (role === 'roof') return pickOf(P.roof, f.i + 3);
    return pickOf(P[role][key], f.i + (role === 'accent' ? 1 : 0));
  }
  const c = (f._mc ||= m(f));
  if (role === 'wall') return P.cream;
  if (role === 'body') return tmpC.copy(c).lerp(WHITE, 0.12);
  if (role === 'accent') return tmpC.copy(c).multiplyScalar(0.72);
  return c;
}
function finish(f, base) {
  const c = base.clone();
  if (flash[f.i] > 0) c.lerp(FLASH, flash[f.i] * 0.85);
  if (state.matches && !state.matches.has(f.i)) c.multiplyScalar(0.18);
  if (f.i === state.selected) c.lerp(WHITE, 0.22);
  if (f.i === state.hover) c.lerp(WHITE, 0.4);
  return c;
}
function updateColors() {

    const key = TYPES[f.curType].key, R = ROLES[key];
    R.facade.forEach((role, k) => facade.setColorAt(f.i * 3 + k, finish(f, roleColor(f, role, key))));
    R.plain.forEach((role, k) => plain.setColorAt(f.i * 2 + k, finish(f, roleColor(f, role, key))));
    if (R.roof) roofs.setColorAt(f.i, finish(f, roleColor(f, R.roof, key)));
    if (R.spire) spires.setColorAt(f.i, finish(f, roleColor(f, R.spire, key)));
  }
  for (const m of [facade, plain, roofs, spires]) m.instanceColor.needsUpdate = true;
  districts.forEach((d, k) => {

  }

  colorsDirty = true;

function weightedPick(list, r) {
  const total = list.reduce((s, x) => s + x.len * (x.main ? 2.5 : 1), 0);
  let v = r * total;
  for (const x of list) { v -= x.len * (x.main ? 2.5 : 1); if (v <= 0) return x; }
  return list[list.length - 1];
}
const mr = rng(42 + files.length);
const cars = roads.length ? Array.from({ length: maxCars }, () => {
  const ring = weightedPick(roads, mr()), dir = mr() < 0.5 ? 1 : -1;
  return { ring, s: mr() * ring.len, dir, speed: (ring.main ? 4 : 2.6) + mr() * 2.5, lane: (ring.main ? 0.62 : 0.36) * dir };
}) : [];
const people = walks.length ? Array.from({ length: maxPeople }, () => {
  const ring = weightedPick(walks, mr());
  return { ring, s: mr() * ring.len, dir: mr() < 0.5 ? 1 : -1, speed: 0.5 + mr() * 0.6, phase: mr() * 6 };
}) : [];

const carBody = inst(box, new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.35 }), cars.length);
const carCab = inst(box, new THREE.MeshStandardMaterial({ color: '#1d2633', roughness: 0.2, metalness: 0.5 }), cars.length);

const tailMat = new THREE.MeshBasicMaterial({ color: '#ff3b30' });

const carTail = inst(box, tailMat, cars.length, { cast: false, receive: false });

function putOriented(mesh, idx, px, y, pz, tx, tz, along, sx, sy, sz) {
  dummy.position.set(px + tx * along, y, pz + tz * along);
  dummy.rotation.set(0, Math.atan2(tx, tz), 0);
  dummy.scale.set(sx, sy, sz);
  dummy.updateMatrix();
  mesh.setMatrixAt(idx, dummy.matrix);
}
function moveStreets(dt, time) {
  // 타임랩스 중엔 그 시점 커밋 수만큼만 차가 다닌다
  const progress = state.time >= N ? 1 : Math.sqrt((state.time + 1) / N);
  const activeCars = Math.round(cars.length * progress);
  cars.forEach((c, k) => {
    if (k >= activeCars) { for (const m of [carBody, carCab, carHead, carTail]) m.setMatrixAt(k, ZERO); return; }
    c.s = (c.s + c.speed * c.dir * dt + c.ring.len) % c.ring.len;
    let [x, z, tx, tz] = onRing(c.ring, c.s, c.lane);
    tx *= c.dir; tz *= c.dir;
    const y = c.ring.lvl;
    putOriented(carBody, k, x, y + 0.13, z, tx, tz, 0, 0.82, 0.42, 1.75);
    putOriented(carCab, k, x, y + 0.55, z, tx, tz, -0.12, 0.72, 0.32, 0.95);
    putOriented(carHead, k, x, y + 0.3, z, tx, tz, 0.88, 0.7, 0.11, 0.04);
    putOriented(carTail, k, x, y + 0.3, z, tx, tz, -0.88, 0.7, 0.11, 0.04);
  });
  for (const m of [carBody, carCab, carHead, carTail]) m.instanceMatrix.needsUpdate = true;
  const activePeople = Math.round(people.length * progress);
  people.forEach((p, k) => {
    if (k >= activePeople) { personMesh.setMatrixAt(k, ZERO); return; }
    p.s = (p.s + p.speed * p.dir * dt + p.ring.len) % p.ring.len;
    const [x, z, tx, tz] = onRing(p.ring, p.s, 0);
    const bob = Math.abs(Math.sin(time * 7 + p.phase)) * 0.05;
    putOriented(personMesh, k, x, p.ring.lvl + bob, z, tx * p.dir, tz * p.dir, 0, 1, 1, 1);
  });
  personMesh.instanceMatrix.needsUpdate = true;
}

  const load = new THREE.Mesh(box, new THREE.MeshStandardMaterial({ color: '#8b5a2b' }));
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), beaconMat);
  for (const m of [jib, counter, load]) m.castShadow = true;
  pivot.add(jib, counter, cable, load, tip);
  g.add(mast, pivot);
  scene.add(g);
  const mx = f.x + (f.cell.w / 2 - 0.55) * (k % 2 ? 1 : -1), mz = f.z + (f.cell.h / 2 - 0.55) * (k % 3 ? 1 : -1);
  return { f, g, mast, pivot, jib, counter, cable, load, tip, mx, mz, speed: 0.25 + (k % 5) * 0.08, phase: k };
});
function moveCranes(time) {
  for (const c of cranes) {

    c.g.position.set(c.mx, c.f.baseY, c.mz);
    c.mast.scale.set(0.32, h, 0.32);
    c.pivot.position.y = h;
    c.jib.scale.set(L, 0.3, 0.3); c.jib.position.x = L / 2 - 0.4;
    c.counter.scale.set(1.2, 0.5, 0.55); c.counter.position.x = -1.2;
    const reach = L * (0.55 + 0.25 * Math.sin(time * 0.4 + c.phase)), drop = 1.5 + (h - 2) * (0.5 + 0.4 * Math.sin(time * 0.6 + c.phase));
    c.cable.scale.set(0.04, drop, 0.04); c.cable.position.set(reach, -drop, 0);
    c.load.scale.set(0.7, 0.4, 0.7); c.load.position.set(reach, -drop - 0.4, 0);

// ───────────────────────── 카메라 전환 ─────────────────────────
// 모든 이동은 이 트윈 하나로: 위치와 바라보는 점을 함께 보간한다.
// 하늘에서의 이동은 사용자가 마우스를 잡는 순간 멈추고 조작을 넘긴다.
let tween = null;
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
function tweenCamera(toPos, toTgt, dur, { cancellable = false } = {}) {
  return new Promise((resolve) => {
    if (tween) tween.resolve();
    if (mode === 'orbit' && controls.enabled) { controls.enableDamping = false; controls.update(); controls.enableDamping = true; } // 남은 관성 제거
    tween = { fromPos: camera.position.clone(), fromTgt: camTarget.clone(), toPos: toPos.clone(), toTgt: toTgt.clone(), t: 0, dur, cancellable, resolve };
    controls.enabled = cancellable && mode === 'orbit';
  });
}
function stepTween(dt) {
  tween.t = Math.min(1, tween.t + dt / tween.dur);
  const e = ease(tween.t);
  camera.position.lerpVectors(tween.fromPos, tween.toPos, e);
  camTarget.lerpVectors(tween.fromTgt, tween.toTgt, e);
  camera.lookAt(camTarget);
  if (mode === 'orbit') controls.target.copy(camTarget);
  if (tween.t >= 1) endTween();
}
function endTween() {
  const t = tween;
  tween = null;
  if (mode === 'orbit') { controls.target.copy(camTarget); controls.enabled = true; controls.update(); }
  t.resolve();
}
controls.addEventListener('start', () => { if (tween?.cancellable) endTween(); });

// 지금 보는 방향(수평)을 유지하면서 정해진 각도로 내려다본다
function viewFrom(target, dist, elev) {
  const dir = camera.position.clone().sub(target);
  dir.y = 0;
  if (dir.lengthSq() < 1e-4) dir.set(0.6, 0, 1);
  dir.normalize().multiplyScalar(Math.cos(elev) * dist);
  return target.clone().add(dir).setY(target.y + Math.sin(elev) * dist);
}
function frameBuilding(f) {
  const b = f.box || { w: 2, d: 2, h: floorsFor(f.l) * FLOOR };
  const target = new THREE.Vector3(f.x, f.baseY + b.h * 0.4, f.z);
  const dist = clamp(b.h * 1.5 + Math.max(b.w, b.d) * 2.2, 9, S * 0.8);
  tweenCamera(viewFrom(target, dist, 0.55), target, 1.0, { cancellable: true });
}
function frameDistrict(d) {
  const target = new THREE.Vector3(d.x + d.w / 2, topY(d.depth), d.y + d.h / 2);
  tweenCamera(viewFrom(target, Math.max(d.w, d.h) * 1.15, 0.75), target, 1.1, { cancellable: true });
}
function fade(v) {
  $('#fade').style.opacity = v;
  return sleep(400);
}

function pick() {
  let hover = -1, hoverDist = -1;
  if (mouseIn && mode === 'orbit') {
    raycaster.setFromCamera(mouse, camera);
    let best = Infinity;
    for (const [mesh, per] of PICKABLE) {
      const hit = raycaster.intersectObject(mesh, false)[0];
      if (hit && hit.distance < best) { best = hit.distance; hover = Math.floor(hit.instanceId / per); }
    }
    const hd = raycaster.intersectObject(distMesh, false)[0];
    if (hd && hd.distance < best - 0.05) { hover = -1; hoverDist = hd.instanceId; }
  }
  if (hover !== state.hover || hoverDist !== state.hoverDist) {
    state.hover = hover;
    state.hoverDist = hoverDist;
    colorsDirty = true;
    renderer.domElement.style.cursor = hover >= 0 || hoverDist > 0 ? 'pointer' : '';
  }
  if (hover >= 0) {
    const f = files[hover], l = linesAt(f, state.time), t = l > 0 ? TYPES[typeOf(l)] : null;
    tip.innerHTML = `<b>${t ? t.icon : '🌱'} ${esc(f.name)}${f.wip ? ' · 🏗️' : ''}</b><div class="p">${esc(f.p)}</div>

    tip.hidden = false;
  } else if (hoverDist > 0) {
    const n = districts[hoverDist].node;
    tip.innerHTML = `<b>📍 ${esc(n.name)}</b><div class="p">${esc(n.path)}</div>
      <div class="m">건물 ${fmt(n.count)}채 · ${fmt(n.lines)}줄 · 클릭하면 확대</div>`;
    tip.hidden = false;
  } else tip.hidden = true;
}

const walk = { pos: new THREE.Vector3(), yaw: 0, pitch: 0.32, dist: 4.2, heading: 0, swing: 0, phase: 0, keys: new Set(), near: null, drag: null, ready: false };
const avatar = (() => {
  const g = new THREE.Group();

function groundAt(x, z) {
  let y = 0;
  for (let k = 0; k < districts.length; k++) {
    const v = districts[k].vis;
    if (distVisible[k] && x >= v.x && x <= v.x + v.w && z >= v.y && z <= v.y + v.h) y = Math.max(y, topY(districts[k].depth));
  }
  for (const f of nearby(x, z)) {
    const c = f.cell;
    if (Math.abs(x - f.x) < c.w / 2 - 0.17 && Math.abs(z - f.z) < c.h / 2 - 0.17) y = Math.max(y, f.surface + 0.05);
  }
  return y;
}
function blocked(x, z) {
  if (Math.abs(x) > S / 2 + 10 || Math.abs(z) > S / 2 + 10) return true;
  for (const f of nearby(x, z)) {
    const b = f.box;
    if (b && Math.abs(x - f.x) < b.w / 2 + R_AVATAR && Math.abs(z - f.z) < b.d / 2 + R_AVATAR) return true;
  }
  return false;
}
function nearestBuilding(x, z) {
  let best = null, bestD = 1.3;
  for (const f of nearby(x, z)) {
    if (!f.box) continue;
    const dx = Math.max(Math.abs(x - f.x) - f.box.w / 2, 0), dz = Math.max(Math.abs(z - f.z) - f.box.d / 2, 0), d = Math.hypot(dx, dz);
    if (d < bestD) { bestD = d; best = f; }
  }
  return best;
}
const headPos = () => walk.pos.clone().setY(walk.pos.y + 0.85);
function walkCamDesired() {
  const head = headPos(), cp = Math.cos(walk.pitch);
  const dir = new THREE.Vector3(Math.sin(walk.yaw) * cp, Math.sin(walk.pitch), Math.cos(walk.yaw) * cp);
  // 건물에 가리면 카메라를 캐릭터 쪽으로 당긴다
  raycaster.set(head, dir);
  raycaster.far = walk.dist;
  let dist = walk.dist;
  for (const m of [facade, plain, roofs]) {
    const hit = raycaster.intersectObject(m, false)[0];
    if (hit) dist = Math.min(dist, hit.distance - 0.25);
  }
  raycaster.far = Infinity;
  return head.addScaledVector(dir, Math.max(0.8, dist));
}
// 아무 건물 앞이 아니라 도로 위에서 시작한다
function spawnPoint(near) {
  let best = null, bestD = Infinity;
  for (const r of roads.filter((r) => r.main)) {
    for (let s = 0; s < r.len; s += 2) {
      const [x, z] = onRing(r, s, 0);
      const d = Math.hypot(x - near.x, z - near.z);
      if (d < bestD && !blocked(x, z)) { bestD = d; best = [x, z]; }
    }
  }
  return best || [0, S / 2 + 4];
}
async function startWalk() {
  if (mode !== 'orbit') return;

  const [x, z] = spawnPoint(controls.target);
  walk.pos.set(x, groundAt(x, z), z);
  walk.yaw = Math.atan2(camera.position.x - x, camera.position.z - z);

async function stopWalk() {

const lerpAngle = (a, b, t) => a + Math.atan2(Math.sin(b - a), Math.cos(b - a)) * t;

function updateWalk(dt, time) {
  const k = walk.keys, moving = walk.ready;
  let ix = 0, iz = 0;
  if (moving) {
    const fx = -Math.sin(walk.yaw), fz = -Math.cos(walk.yaw), rx = Math.cos(walk.yaw), rz = -Math.sin(walk.yaw);
    if (k.has('KeyW') || k.has('ArrowUp')) { ix += fx; iz += fz; }
    if (k.has('KeyS') || k.has('ArrowDown')) { ix -= fx; iz -= fz; }
    if (k.has('KeyD') || k.has('ArrowRight')) { ix += rx; iz += rz; }
    if (k.has('KeyA') || k.has('ArrowLeft')) { ix -= rx; iz -= rz; }
  }
  const len = Math.hypot(ix, iz);
  const run = k.has('ShiftLeft') || k.has('ShiftRight');
  if (len > 0) {
    const sp = (run ? 9.5 : 4.2) * dt;
    ix /= len; iz /= len;
    const px = walk.pos.x, pz = walk.pos.z, nx = px + ix * sp, nz = pz + iz * sp;
    if (!blocked(nx, nz)) { walk.pos.x = nx; walk.pos.z = nz; }
    else if (!blocked(nx, pz)) walk.pos.x = nx;
    else if (!blocked(px, nz)) walk.pos.z = nz;
    walk.heading = lerpAngle(walk.heading, Math.atan2(ix, iz), Math.min(1, dt * 12));
    walk.phase += dt * (run ? 15 : 9);
  }
  walk.swing += ((len > 0 ? (run ? 0.9 : 0.6) : 0) - walk.swing) * Math.min(1, dt * 10);
  walk.pos.y += (groundAt(walk.pos.x, walk.pos.z) - walk.pos.y) * Math.min(1, dt * 14);

  avatar.position.copy(walk.pos);
  avatar.position.y += Math.abs(Math.sin(walk.phase)) * 0.04 * walk.swing;
  avatar.rotation.y = walk.heading;
  const s = Math.sin(walk.phase) * walk.swing;
  avatar.userData.legs[0].rotation.x = s; avatar.userData.legs[1].rotation.x = -s;
  avatar.userData.arms[0].rotation.x = -s * 0.8; avatar.userData.arms[1].rotation.x = s * 0.8;
  avatar.children[avatar.children.length - 1].material.opacity = 0.5 + 0.3 * Math.sin(time * 3);

  const near = moving ? nearestBuilding(walk.pos.x, walk.pos.z) : null;
  if (near !== walk.near) {
    walk.near = near;
    if (near) $('#prompt').innerHTML = `<kbd>E</kbd> ${TYPES[near.curType].icon} <b>${esc(near.name)}</b> 들어가기 <span style="color:var(--muted);font-weight:500">· ${near.box.floors}층</span>`;
    $('#prompt').classList.toggle('on', !!near);
  }

  if (!tween) {
    camera.position.lerp(walkCamDesired(), 1 - Math.exp(-dt * 12));
    camTarget.copy(headPos());
    camera.lookAt(camTarget);
  }
}

  const tex = canvasTex(1024, 640, (g, w, h) => {
    const sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#' + ramp(SKY.bg, n).getHexString());
    sky.addColorStop(1, n > 0.5 ? '#1b2a52' : n > 0.2 ? '#ffd0a0' : '#e6f3ff');
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    for (let layer = 0; layer < 2; layer++) {
      for (let x = -20; x < w; x += 40 + r() * 70) {
        const bw = 50 + r() * 90, bh = 140 + r() * (layer ? 260 : 380);
        g.fillStyle = layer ? (n > 0.5 ? '#0c1222' : '#8aa1b8') : (n > 0.5 ? '#152038' : '#b7c7d6');
        g.fillRect(x, h - bh, bw, bh);
        for (let wy = h - bh + 14; wy < h - 10; wy += 22) for (let wx = x + 8; wx < x + bw - 10; wx += 16) {
          g.fillStyle = n > 0.5 ? (r() < 0.45 ? '#ffd27a' : '#1d2742') : 'rgba(255,255,255,.35)';
          g.fillRect(wx, wy, 8, 11);
        }
      }
    }
  });
  for (const m of lob.viewMat) { m.material.map?.dispose(); m.material.map = tex; m.material.needsUpdate = true; }
  for (const l of lob.warm) l.intensity = 22 + n * 14;
  lob.sunIn.intensity = 1.1 - n * 0.9;
}
function lobbyView() {
  const W = innerWidth, H = innerHeight;

const HL_LANG = { TypeScript: 'typescript', JavaScript: 'javascript', Python: 'python', CSS: 'css', HTML: 'xml', JSON: 'json', YAML: 'yaml', Shell: 'bash', SQL: 'sql',
  Java: 'java', Kotlin: 'kotlin', Go: 'go', Rust: 'rust', 'C#': 'csharp', C: 'c', 'C++': 'cpp', Ruby: 'ruby', PHP: 'php', Swift: 'swift', Dart: 'dart', Vue: 'xml', XML: 'xml', Config: 'ini' };

// 함수·클래스 목록 (정확한 파서가 아니라 길잡이용)
function outlineOf(text, lang) {
  const out = [], lines = text.split('\n');
  const isJs = ['TypeScript', 'JavaScript', 'Vue', 'Svelte'].includes(lang);
  const KW = /^(if|for|while|switch|catch|return|else|do|function|new|typeof|await|constructor)$/;
  lines.forEach((ln, i) => {
    let m;
    const line = i + 1;
    if (lang === 'Python') {
      if ((m = ln.match(/^(\s*)class\s+(\w+)/))) out.push({ name: m[2], kind: 'class', line, depth: m[1].length ? 1 : 0 });
      else if ((m = ln.match(/^(\s*)(?:async\s+)?def\s+(\w+)/))) out.push({ name: `${m[2]}()`, kind: m[1].length ? 'method' : 'fn', line, depth: m[1].length ? 1 : 0 });
    } else if (isJs) {
      const depth = /^\s+/.test(ln) ? 1 : 0;
      if ((m = ln.match(/^\s*(?:export\s+)?(?:default\s+)?(?:abstract\s+)?class\s+(\w+)/))) out.push({ name: m[1], kind: 'class', line, depth });
      else if ((m = ln.match(/^\s*(?:export\s+)?(?:default\s+)?(?:async\s+)?function\s*\*?\s*(\w+)/))) out.push({ name: `${m[1]}()`, kind: /^[A-Z]/.test(m[1]) ? 'comp' : 'fn', line, depth });
      else if ((m = ln.match(/^\s*(?:export\s+)?(?:const|let|var)\s+(\w+)\s*(?::[^=]+)?=\s*(?:async\s*)?(?:\([^)]*\)|\w+)\s*(?::[^=]+)?=>/))) out.push({ name: `${m[1]}()`, kind: /^[A-Z]/.test(m[1]) ? 'comp' : 'fn', line, depth });
      else if ((m = ln.match(/^\s*(?:export\s+)?(?:const|let)\s+(\w+)\s*(?::[^=]+)?=\s*(?:React\.)?(?:memo|forwardRef|useCallback|useMemo)\(/))) out.push({ name: `${m[1]}()`, kind: 'fn', line, depth });
      else if ((m = ln.match(/^\s*(?:export\s+)?(?:declare\s+)?(?:interface|type|enum)\s+(\w+)/))) out.push({ name: m[1], kind: 'type', line, depth });
      else if ((m = ln.match(/^(\s{2,})(?:public |private |protected |static |async |get |set |override )*(\w+)\s*\([^)]*\)\s*(?::\s*[^{]+)?\{\s*$/)) && !KW.test(m[2])) out.push({ name: `${m[2]}()`, kind: 'method', line, depth: 1 });
    } else if (lang === 'CSS') {
      if ((m = ln.match(/^([.#@:a-zA-Z*][^{]*?)\s*\{/))) out.push({ name: m[1].trim().slice(0, 48), kind: 'style', line, depth: 0 });
    } else if ((m = ln.match(/^\s*(?:pub\s+)?(?:func|fn|fun|def|function|sub)\s+(\w+)/))) out.push({ name: `${m[1]}()`, kind: 'fn', line, depth: 0 });
  });
  return out.slice(0, 400);
}
const KIND_ICON = { class: '🏛', fn: 'ƒ', comp: '⚛', type: '◇', method: '·', style: '#' };

// 파일 맨 위 설명 주석 → "이 건물이 하는 일"
function introOf(text) {
  const lines = text.split('\n');
  let i = 0;
  while (i < lines.length && (/^\s*$/.test(lines[i]) || /^#!|^\s*['"]use (client|strict|server)['"]|eslint-disable|^\s*#\s*-\*-/.test(lines[i]))) i++;
  const out = [], t = lines[i] || '';
  if (/^\s*[rRbBuU]?("""|''')/.test(t)) {
    const q = t.includes('"""') ? '"""' : "'''";
    const first = t.slice(t.indexOf(q) + 3);
    if (first.includes(q)) out.push(first.slice(0, first.indexOf(q)));
    else {
      out.push(first);
      for (i++; i < lines.length && !lines[i].includes(q); i++) out.push(lines[i]);
      if (i < lines.length) out.push(lines[i].slice(0, lines[i].indexOf(q)));
    }
  } else if (/^\s*\/\*/.test(t)) {
    for (; i < lines.length; i++) {
      out.push(lines[i].replace(/^\s*\/?\*+\/?\s?/, '').replace(/\*\/\s*$/, ''));
      if (lines[i].includes('*/')) break;
    }
  } else {
    for (; i < lines.length && /^\s*(\/\/|#(?!include)|<!--|--)/.test(lines[i]); i++) out.push(lines[i].replace(/^\s*(\/\/+|#+|<!--|--)\s?/, '').replace(/-->\s*$/, ''));
  }
  return out.map((s) => s.trim()).filter((s) => s && !/^[-=*#_]{3,}$/.test(s)).slice(0, 8).join('\n');
}

function renderBoard(f, intro, outline) {
  const fnCount = outline.filter((o) => o.kind !== 'type' && o.kind !== 'style' && o.kind !== 'class').length;
  const classCount = outline.filter((o) => o.kind === 'class').length;
  const auto = `${TYPES[typeOf(f.l)].name} ${insideFloors}층 건물이에요. ` +
    `${fnCount ? `함수 ${fnCount}개` : '함수 없이'}${classCount ? ` · 클래스 ${classCount}개` : ''}로 이뤄져 있고, ` +
    `다른 건물 ${f.dep.length}곳을 이용하며 ${usedBy[f.i].length}곳이 이 건물을 이용해요.`;
  // 층별로 묶기: 줄 위치 → 층 (바깥에서 본 층수와 같다)
  const byFloor = new Map();
  for (const o of outline) { const fl = floorOfLine(o.line); if (!byFloor.has(fl)) byFloor.set(fl, []); byFloor.get(fl).push(o); }
  const lpf = f.l / insideFloors;
  const floorsHtml = [...Array(insideFloors)].map((_, k) => insideFloors - k).map((fl) => {
    const items = byFloor.get(fl);
    if (!items && outline.length) return '';
    const rows = items
      ? items.map((o) => `<button class="it${o.depth ? ' d1' : ''}" data-line="${o.line}"><i>${KIND_ICON[o.kind]}</i><span>${esc(o.name)}</span><small>L${o.line}</small></button>`).join('')
      : `<button class="it" data-line="${Math.max(1, Math.round((fl - 1) * lpf) + 1)}"><i>·</i><span>${Math.round((fl - 1) * lpf) + 1}–${Math.round(fl * lpf)}줄</span></button>`;
    return `<div class="fl" data-floor="${fl}"><span class="fb">${fl}F</span><div class="items">${rows}</div></div>`;
  }).join('');
  const linkList = (ids, empty) => {
    if (!ids.length) return `<div class="more">${empty}</div>`;
    const shown = ids.slice(0, 24).map((j) => {
      const g = files[j];
      return `<button class="lk" data-go="${j}"><i>${TYPES[typeOf(g.l)].icon}</i><span>${esc(g.name)}</span><small>${esc(g.p.split('/').slice(-2, -1)[0] || '')}</small></button>`;
    }).join('');
    return shown + (ids.length > 24 ? `<div class="more">외 ${ids.length - 24}곳</div>` : '');
  };
  $('#board').innerHTML = `
    <div class="sec">
      <h4>ABOUT · 이 건물이 하는 일</h4>
      <div class="intro${intro ? '' : ' auto'}">${esc(intro || auto)}</div>
      <div class="facts"><div><b>${fmt(f.l)}</b><small>줄</small></div><div><b>${fnCount}</b><small>함수</small></div><div><b>${HAS_GIT ? fmt(f.ch) : '–'}</b><small>커밋</small></div></div>
    </div>
    <div class="sec floors">
      <h4>DIRECTORY · 층별 안내</h4>
      ${floorsHtml || '<div class="more">안내할 함수가 없어요</div>'}
    </div>
    <div class="sec">
      <h4>🔌 이 건물이 쓰는 곳 · ${f.dep.length}</h4>
      ${linkList(f.dep, '다른 건물을 쓰지 않아요')}
    </div>
    <div class="sec">
      <h4>🧲 이 건물을 쓰는 곳 · ${usedBy[f.i].length}</h4>
      ${linkList(usedBy[f.i], '아직 아무도 안 써요')}
    </div>`;
}

const LINE_H = 20;
function renderCode(text, lang, hljs) {
  const n = text.split('\n').length;
  let html = esc(text);
  const hl = HL_LANG[lang];
  if (hljs && hl && hljs.getLanguage(hl) && text.length < 600000) {
    try { html = hljs.highlight(text, { language: hl, ignoreIllegals: true }).value; } catch {}
  }
  $('#scroller').innerHTML = `<div class="code"><pre class="gutter">${Array.from({ length: n }, (_, k) => k + 1).join('\n')}</pre><pre class="src hljs"><code>${html}</code></pre></div>`;
  $('#scroller').scrollTop = 0;
}
function gotoLine(line) {
  const sc = $('#scroller');
  sc.scrollTo({ top: Math.max(0, (line - 1) * LINE_H - sc.clientHeight * 0.3), behavior: 'smooth' });
  sc.querySelector('.hl')?.remove();
  const mark = document.createElement('div');
  mark.className = 'hl';
  mark.style.top = `${12 + (line - 1) * LINE_H}px`;
  sc.querySelector('.code')?.appendChild(mark);
}
let lastFloor = 1;
$('#scroller').addEventListener('scroll', () => {

  const sc = $('#scroller');

async function exitBuilding() {
  if (mode !== 'inside') return;
  await fade(1);
  const f = insideFile;
  $('#inside').hidden = true;
  document.body.classList.remove('inside');
  insideFile = null;
  mode = insideFrom;

  camera.lookAt(camTarget);
  if (mode === 'orbit') {
    controls.target.copy(camTarget);
    controls.enabled = true;
    controls.update();
  } else {
    // 다른 건물로 옮겨갔다면 그 건물 앞에 내려준다
    const at = nearestBuilding(walk.pos.x, walk.pos.z);
    if (at !== f) {
      for (const [dx, dz] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
        const x = f.x + dx * (f.box.w / 2 + 0.7), z = f.z + dz * (f.box.d / 2 + 0.7);
        if (!blocked(x, z)) { walk.pos.set(x, groundAt(x, z), z); walk.yaw = Math.atan2(dx, dz); break; }
      }
      camera.position.copy(walkCamDesired());
    }
    walk.near = undefined;
  }
  await fade(0);
  if (mode === 'orbit') select(f.i, true);
}

const WALK_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ShiftLeft', 'ShiftRight']);
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (mode === 'inside') {
    if (e.key === 'Escape') exitBuilding();

const selBox = new THREE.LineSegments(new THREE.EdgesGeometry(box), new THREE.LineBasicMaterial({ color: '#ffffff' }));
const pin = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.2, 4), new THREE.MeshBasicMaterial({ color: '#ff5a5a' }));
pin.rotation.x = Math.PI;
selBox.visible = pin.visible = false;

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  if (mode === 'inside') {
    lobbyCam.position.set(Math.sin(time * 0.18) * 0.5, 2.25 + Math.sin(time * 0.31) * 0.04, 6.4);
    lobbyCam.lookAt(0, 2.55, -LB.D / 2);
    renderer.render(lobby, lobbyCam);
    return;
  }

  if (state.playing) {
    state.t += dt * state.speed;
    if (state.t >= N) { setTime(N); setPlaying(false); }
    else setTime(Math.floor(state.t));
  }

  let moved = false;
  if (intro !== null) {
    let done = true;
    for (const f of files) {
      const p = clamp01((time - introDelay[f.i]) / 0.8);
      if (p < 1) done = false;
      const l = tgtL[f.i] * (1 - (1 - p) ** 3);
      if (l !== curL[f.i]) { curL[f.i] = l; placeBuilding(f, l); moved = true; }
    }
    if (done) intro = null;
  } else {
    const k = Math.min(1, dt * 7);
    for (const f of files) {
      const d = tgtL[f.i] - curL[f.i];
      if (!d) continue;
      curL[f.i] = Math.abs(d) < 0.5 ? tgtL[f.i] : curL[f.i] + d * k;
      placeBuilding(f, curL[f.i]);
      moved = true;
    }
  }
  if (moved) flushBuildings();
  if (colorsDirty) updateColors();

  night += (nightTarget() - night) * Math.min(1, dt * 1.5);
  applySky(time);
  moveStreets(dt, time);
  moveCranes(time);
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > S * 1.3) c.position.x = -S * 1.3;
  }

  const sel = mode === 'orbit' && state.selected >= 0 && files[state.selected].box;
  selBox.visible = pin.visible = !!sel;
  if (sel) {
    const f = files[state.selected], b = f.box;
    selBox.position.set(f.x, f.baseY, f.z);
    selBox.scale.set(b.w * 1.05, b.h * 1.01, b.d * 1.05);
    pin.position.set(f.x, f.baseY + b.h + 1.6 + Math.sin(time * 3) * 0.3, f.z);
    pin.rotation.y = time;
  }

  if (mode === 'walk') updateWalk(dt, time);
  if (tween) stepTween(dt);
  else if (mode === 'orbit') { controls.update(); camTarget.copy(controls.target); }

  if (mode === 'orbit' && (mouseDirty || moved || tween)) { pick(); mouseDirty = false; }
  if (night > 0.03) composer.render(); else renderer.render(scene, camera);
  updateLabels();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  if (mode === 'inside') lobbyView();
});
</script>
</body>
</html>
