<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repopolis · __CITY_TITLE__</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root {
    --bg: #090c14;
    --panel: rgba(15, 20, 33, 0.82);
    --panel-solid: #0f1421;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);
    --text: #e8ebf3;
    --muted: #8b94a9;
    --faint: #5f687d;
    --accent: #7aa2ff;
    --claude: #ff8a5c;
    --gold: #d9b46a;
    --radius: 14px;
    --mono: Consolas, "D2Coding", "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.5 "Pretendard Variable", Pretendard, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; }
  #stage, #stage canvas { position: fixed; inset: 0; display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .label { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; padding: 2px 9px 2px 7px;
    display: flex; align-items: center; gap: 6px; border-radius: 99px; background: rgba(12, 16, 26, .58);
    border: 1px solid rgba(255,255,255,.14); color: rgba(255,255,255,.92); font-size: 12px; font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,.5); transition: opacity .25s; }
  .label::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #6fd39b; flex: none; }
  .label.d2 { font-size: 11px; padding: 1px 8px 1px 6px; color: rgba(255,255,255,.8); }
  .label.d2::before { background: #7aa2ff; width: 5px; height: 5px; }
  body.no-labels #labels { display: none; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }

  /* 상단 바 */
  #top { position: fixed; top: 14px; left: 14px; right: 14px; display: flex; align-items: center; gap: 8px; pointer-events: none; z-index: 5; }
  #top > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; height: 40px; }
  .logo { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    background: linear-gradient(135deg, #5b7cfa, #ff8a5c); font-size: 14px; }
  .brand b { font-size: 14px; letter-spacing: -0.01em; }
  .brand .proj { color: var(--muted); font-weight: 500; }
  .live { display: none; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #ff6b6b; }
  .live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .tbtn { cursor: pointer; padding: 0 13px; height: 40px; display: flex; align-items: center; gap: 6px; color: var(--text);
    font: inherit; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .tbtn:hover { border-color: var(--line-strong); background: rgba(30, 38, 58, 0.9); }
  .tbtn.on { border-color: rgba(122, 162, 255, .6); color: #cfe0ff; }
  .tbtn:disabled { opacity: .4; cursor: default; }
  .chips { display: flex; gap: 6px; margin-left: 4px; }
  .chip { padding: 0 11px; height: 32px; display: flex; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 650; margin-left: 5px; font-variant-numeric: tabular-nums; }
  .search { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 40px; width: 240px; }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; }
  .search input::placeholder { color: var(--faint); }
  .search span { color: var(--muted); font-size: 11.5px; white-space: nowrap; }

  /* 왼쪽 패널 */
  #side { position: fixed; top: 68px; left: 14px; width: 272px; max-height: calc(100% - 96px); overflow: auto; padding: 6px 0; }
  #side section { padding: 12px 16px; }
  #side section + section { border-top: 1px solid var(--line); }
  h3 { margin: 0 0 10px; font-size: 12px; font-weight: 650; color: var(--muted); letter-spacing: 0.02em; }
  h3 .sub { font-weight: 450; color: var(--faint); margin-left: 6px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; background: rgba(255, 255, 255, 0.04); border-radius: 10px; }
  .seg button { all: unset; cursor: pointer; text-align: center; padding: 7px 4px; border-radius: 7px; color: var(--muted); font-size: 12px; font-weight: 550; }
  .seg button:first-child { grid-column: 1 / -1; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: rgba(255, 255, 255, 0.1); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .seg button:disabled { opacity: .35; cursor: not-allowed; }
  #legend { margin-top: 12px; }
  .grad { height: 8px; border-radius: 99px; }
  .grad-labels { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; color: var(--muted); }
  .legend-note { margin-top: 8px; font-size: 11.5px; color: var(--faint); }
  .langs { display: flex; flex-direction: column; gap: 5px; }
  .lang { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .lang i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .lang span { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  #hot { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  #hot li { cursor: pointer; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; }
  #hot li:hover { background: rgba(255, 255, 255, 0.05); }
  #hot .row { display: flex; gap: 8px; align-items: baseline; }
  #hot .rank { color: var(--faint); font-size: 11px; width: 14px; flex: none; font-variant-numeric: tabular-nums; }
  #hot .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
  #hot .meta { margin: 1px 0 0 22px; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  /* 범례: 아이콘 | 이름 | 값 — 모든 행이 같은 열에 맞춰진다 */
  .legend { display: grid; grid-template-columns: 20px 1fr auto; column-gap: 8px; row-gap: 5px; align-items: center; font-size: 12px; }
  .legend .ic { text-align: center; font-size: 13px; line-height: 1; }
  .legend .nm { color: var(--text); font-weight: 600; }
  .legend .v { color: var(--muted); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .legend .sep { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 5px 0; }

  /* 상세 패널 */
  #detail { position: fixed; top: 68px; right: 14px; width: 330px; max-height: calc(100% - 96px); overflow: auto; padding: 18px; }
  .close { all: unset; cursor: pointer; position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 8px;
    display: grid; place-items: center; color: var(--muted); font-size: 16px; }
  .close:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 600; }
  .tag i { width: 8px; height: 8px; border-radius: 2px; }
  .wip { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 99px; background: rgba(242, 183, 5, .16); color: #f2b705; font-size: 11px; font-weight: 650; }
  .fname { margin: 6px 30px 2px 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; word-break: break-all; }
  .fpath { color: var(--faint); font-size: 11.5px; word-break: break-all; }
  .btype { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .btype b { color: var(--text); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
  .stat { padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); }
  .stat small { display: block; color: var(--muted); font-size: 11px; }
  .stat b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
  .kv span:first-child { color: var(--muted); }
  .kv span:last-child { text-align: right; }
  .meter { height: 6px; border-radius: 9px; background: #5b7cfa; overflow: hidden; margin-top: 6px; }
  .meter i { display: block; height: 100%; background: var(--claude); }
  .sect-title { margin: 18px 0 8px; font-size: 12px; font-weight: 650; color: var(--muted); }
  .commit { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12px; }
  .commit .when { color: var(--faint); flex: none; width: 52px; font-variant-numeric: tabular-nums; }
  .rel { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 8px; align-items: center; width: 100%; padding: 5px 6px; margin: 0 -6px; border-radius: 8px; font-size: 12px; }
  .rel:hover { background: rgba(255,255,255,.06); }
  .rel i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .rel span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rel small { color: var(--muted); font-size: 11px; flex: none; }
  .rel .warn, .warn { color: #ff8fb0; font-weight: 650; }
  .sect-title .sub { font-weight: 450; color: var(--faint); margin-left: 4px; font-size: 11px; }
  .commit .msg { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .btns { display: flex; gap: 8px; margin-top: 18px; }
  .btn { all: unset; box-sizing: border-box; cursor: pointer; flex: 1; text-align: center; padding: 10px; border-radius: 10px; background: #2f6fed; color: #fff; font-weight: 650; }
  .btn.ghost { background: rgba(255,255,255,.08); }
  .btn:hover { filter: brightness(1.12); }

  /* 타임랩스 알약 */
  #tlpill { position: fixed; top: 66px; left: 50%; transform: translateX(-50%); width: min(640px, calc(100% - 640px)); min-width: 380px;
    display: flex; align-items: center; gap: 10px; padding: 7px 8px 9px 8px; z-index: 4; overflow: hidden; }
  #tlpill .ib { all: unset; cursor: pointer; flex: none; height: 26px; min-width: 26px; padding: 0 7px; border-radius: 8px; display: grid; place-items: center;
    background: rgba(255,255,255,.08); font-size: 11.5px; font-weight: 700; box-sizing: border-box; }
  #tlpill .ib:hover { background: rgba(255,255,255,.16); }
  #tlpill .date { flex: none; font-weight: 650; font-variant-numeric: tabular-nums; font-size: 12px; }
  #tlpill .who { flex: none; color: var(--muted); font-size: 12px; }
  #tlpill .who.ai { color: var(--claude); }
  #tlpill .subj { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c3cad9; font-size: 12px; }
  #tlpill .cnt { flex: none; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  #tlpill .bar { position: absolute; left: 10px; right: 10px; bottom: 3px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.1); }
  #tlpill .bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }

  /* 걷기 */
  #walkHud { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px;
    padding: 8px 8px 8px 16px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  kbd { display: inline-block; min-width: 20px; padding: 1px 6px; margin-right: 3px; border-radius: 5px; border: 1px solid var(--line-strong);
    border-bottom-width: 2px; background: rgba(255,255,255,.06); color: var(--text); font: 600 11px var(--mono); text-align: center; }
  #prompt { position: fixed; left: 50%; bottom: 74px; transform: translate(-50%, 8px); opacity: 0; transition: .2s; padding: 10px 16px;
    font-size: 13.5px; font-weight: 650; pointer-events: none; white-space: nowrap; }
  #prompt.on { opacity: 1; transform: translate(-50%, 0); }
  body.walking #tlBtn, body.walking #side, body.walking #detail, body.walking #hint, body.walking .search, body.walking .chips { display: none !important; }
  body.inside #top, body.inside #side, body.inside #detail, body.inside #hint, body.inside #labels,
  body.inside #tlpill, body.inside #tip, body.inside #flyBtn { display: none !important; }
  body:not(.inside) #inLabels { display: none; }
  #inLabels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 15; }
  .in-label { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; padding: 3px 10px 3px 7px; border-radius: 99px;
    display: flex; align-items: center; gap: 6px; background: rgba(26, 18, 12, .78); border: 1px solid rgba(217, 180, 106, .45);
    color: #f6e7c8; font: 600 12px var(--mono); box-shadow: 0 4px 14px rgba(0,0,0,.35); transition: opacity .2s; }
  .in-label i { font-style: normal; color: var(--gold); }
  .in-label.k-class { border-color: rgba(122, 162, 255, .6); }
  .in-label.k-comp { border-color: rgba(127, 211, 255, .6); }
  .in-label.k-cabinet { color: #cdb98f; }
  body.inside #walkHud { z-index: 21; }
  body.inside #prompt { z-index: 21; }
  #fade { position: fixed; inset: 0; background: #07090f; opacity: 0; pointer-events: none; transition: opacity .38s ease; z-index: 60; }

  #tip { position: fixed; pointer-events: none; z-index: 10; padding: 8px 11px; border-radius: 10px; background: var(--panel-solid);
    border: 1px solid var(--line-strong); font-size: 12px; max-width: 340px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
  #tip b { display: block; font-size: 13px; }
  #tip .p { color: var(--faint); font-size: 11px; word-break: break-all; }
  #tip .m { color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  #toast { position: fixed; left: 50%; top: 116px; transform: translate(-50%, -12px); opacity: 0; transition: .35s; padding: 10px 16px; z-index: 6;
    font-weight: 650; pointer-events: none; max-width: min(640px, calc(100% - 40px)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #hint { position: fixed; right: 18px; bottom: 16px; color: rgba(255,255,255,.6); font-size: 11.5px; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }

  /* ───── 건물 안 ───── */
  #inside { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
  #inside > * { pointer-events: auto; }
  .in-top { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 10px; pointer-events: none !important; }
  .in-top > * { pointer-events: auto; }
  .plate, .in-btn { background: rgba(26, 18, 12, .82); border: 1px solid rgba(217, 180, 106, .38); border-radius: 14px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .plate { display: flex; align-items: center; gap: 12px; padding: 0 18px 0 12px; height: 46px; }
  .plate .ic { font-size: 22px; }
  .plate b { font-size: 16px; color: #f6e7c8; letter-spacing: -0.01em; }
  .plate span { color: #c9b48a; font-size: 12px; }
  .in-btns { margin-left: auto; display: flex; gap: 8px; }
  .in-btn { cursor: pointer; height: 46px; padding: 0 16px; color: #f6e7c8; font: inherit; font-weight: 650; }
  .in-btn:hover { border-color: rgba(217, 180, 106, .75); }
  .board .close { color: #c9b48a; }
  /* 패널은 스르륵: 코드는 오른쪽, 안내판은 왼쪽에서 밀려 들어오고 엘리베이터는 살짝 커지며 나타난다 */
  .board, .monitor, .elev-panel { transition: transform .42s cubic-bezier(.2, .85, .25, 1), opacity .3s ease; }
  .board:not(.open) { transform: translateX(calc(-100% - 40px)); opacity: 0; pointer-events: none !important; }
  .monitor:not(.open) { transform: translateX(calc(100% + 40px)); opacity: 0; pointer-events: none !important; }
  .elev-panel:not(.open) { transform: translate(-50%, -46%) scale(.94); opacity: 0; pointer-events: none !important; }
  .monitor.open .scroller { animation: codeIn .5s ease .12s both; }
  @keyframes codeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .board { position: fixed; top: 76px; left: 16px; bottom: 80px; width: 340px; overflow: auto; padding: 18px 18px 22px; border-radius: 16px;
    background: linear-gradient(180deg, rgba(48, 32, 22, .94), rgba(28, 19, 13, .94)); border: 1px solid rgba(217, 180, 106, .42);
    box-shadow: inset 0 1px 0 rgba(255, 235, 190, .1), 0 24px 60px rgba(0,0,0,.5); color: #f1e3c4; }
  .board h4 { margin: 0 0 8px; font-size: 10.5px; letter-spacing: .2em; color: var(--gold); font-weight: 750; }
  .board h4 + h4 { margin-top: 0; }
  .board .sec + .sec { margin-top: 20px; }
  .intro { padding: 12px 14px; border-radius: 10px; background: rgba(0,0,0,.24); border-left: 3px solid var(--gold);
    font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; color: #f0e4c9; }
  .intro.auto { color: #cdb98f; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .facts div { padding: 7px 8px; border-radius: 8px; background: rgba(0,0,0,.2); text-align: center; }
  .facts b { display: block; font-size: 15px; color: #f6e7c8; font-variant-numeric: tabular-nums; }
  .facts small { color: #a58f63; font-size: 10.5px; }
  .floors .fl { display: flex; gap: 10px; padding: 6px 0; border-top: 1px dashed rgba(217, 180, 106, .2); }
  .floors .fb { flex: none; width: 42px; height: 24px; margin-top: 1px; border-radius: 6px; display: grid; place-items: center;
    background: linear-gradient(#ecd08e, #b48c3c); color: #2a1d14; font-weight: 800; font-size: 11.5px; font-variant-numeric: tabular-nums; transition: .2s; }
  .floors .fl.on .fb { box-shadow: 0 0 0 2px #fff3c9, 0 0 16px rgba(255, 214, 120, .65); }
  .floors .items { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .it, .lk { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 7px; align-items: baseline; padding: 2px 6px; border-radius: 6px;
    font: 12px/1.65 var(--mono); color: #f6ead0; min-width: 0; }
  .it:hover, .lk:hover { background: rgba(217, 180, 106, .16); }
  .it i, .lk i { font-style: normal; color: var(--gold); width: 14px; text-align: center; flex: none; }
  .it span, .lk span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .it.d1 { padding-left: 18px; color: #d8c8a4; }
  .it small, .lk small { margin-left: auto; padding-left: 8px; color: #9c875e; font-size: 10.5px; flex: none; }
  .lk { font-family: inherit; font-size: 12.5px; }
  .more { color: #9c875e; font-size: 11.5px; padding: 2px 6px; }
  .monitor { position: fixed; top: 76px; right: 16px; bottom: 80px; width: min(680px, 46vw); display: flex; flex-direction: column;
    border-radius: 16px; background: #0d1117; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 0 0 6px #05070b, 0 30px 70px rgba(0,0,0,.55); overflow: hidden; }
  .mon-head { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 42px; flex: none; background: #161b22;
    border-bottom: 1px solid rgba(255,255,255,.07); font-size: 12.5px; color: #c9d1d9; }
  .mon-head .dots { display: flex; gap: 6px; }
  .mon-head .dots i { width: 10px; height: 10px; border-radius: 50%; }
  .mon-head .fn { font-family: var(--mono); }
  .mon-head .lncount { color: #6e7681; }
  .elev { margin-left: auto; padding: 3px 10px; border-radius: 6px; background: #170707; color: #ff5a3c; border: 1px solid #3a1010;
    font: 700 13px var(--mono); letter-spacing: .08em; text-shadow: 0 0 8px rgba(255, 80, 50, .75); }
  .scroller { flex: 1; overflow: auto; position: relative; }
  .in-top .elev { margin-left: 0; height: 46px; display: grid; place-items: center; padding: 0 14px; border-radius: 14px; font-size: 15px; }
  /* 엘리베이터 층 고르기 */
  .elev-panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); max-height: 70vh; overflow: auto;
    padding: 16px; border-radius: 18px; background: rgba(20, 22, 28, .94); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 80px rgba(0,0,0,.6); z-index: 30; }
  .elev-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: #c9d1d9; font-size: 13px; }
  .elev-head b { font-size: 15px; color: #fff; }
  .elev-head span { color: #8b949e; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const DATA = "__CITY_DATA__";

const $ = (s) => document.querySelector(s);
const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clamp01 = (v) => clamp(v, 0, 1);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const NOW = DATA.generatedAt;
const COMMITS = DATA.commits; // [hash, ts, authorIdx, subject, claude, touchedHere, touchedTotal]
const N = COMMITS.length;
const HAS_GIT = DATA.git && N > 0;
const BRIDGE = window.repopolis; // 데스크톱 앱에서만 존재
const store = {
  get(k) { try { return sessionStorage.getItem(k) ?? localStorage.getItem(k); } catch { return null; } },
  set(k, v, session) { try { (session ? sessionStorage : localStorage).setItem(k, v); } catch {} },
};

// 결정적 난수 — 같은 프로젝트는 매번 같은 모습
function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
}
const pickOf = (arr, i) => arr[((i * 2654435761) >>> 0) % arr.length];

function ago(ts) {
  const d = (NOW - ts) / 86400;
  if (d < 1) return '오늘';
  if (d < 2) return '어제';
  if (d < 30) return `${Math.floor(d)}일 전`;
  if (d < 365) return `${Math.floor(d / 30)}개월 전`;
  return `${(d / 365).toFixed(1)}년 전`;
}
function ymd(ts, withTime) {
  const d = new Date(ts * 1000), p = (n) => String(n).padStart(2, '0');
  const s = `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}`;
  return withTime ? `${s} ${p(d.getHours())}:${p(d.getMinutes())}` : s;
}
function percentile(values, q) {
  const s = values.filter((v) => v > 0).sort((a, b) => a - b);
  return s.length ? s[Math.min(s.length - 1, Math.floor(q * s.length))] : 1;
}

// ───────────────────────── 데이터 → 트리 ─────────────────────────
const files = DATA.files.map((f, i) => {
  const n = f.tl.length / 2, tlIdx = new Int32Array(n), tlVal = new Int32Array(n);
  for (let k = 0; k < n; k++) { tlIdx[k] = f.tl[2 * k]; tlVal[k] = f.tl[2 * k + 1]; }
  return { ...f, i, name: f.p.split('/').pop(), tlIdx, tlVal, curType: -1, dep: f.dep || [] };
});
const usedBy = files.map(() => []);
for (const f of files) for (const j of f.dep) usedBy[j].push(f.i);

const root = { name: DATA.name, path: '', dirs: new Map(), files: [], depth: 0 };
for (const f of files) {
  const parts = f.p.split('/');
  let node = root;
  for (let k = 0; k < parts.length - 1; k++) {
    let next = node.dirs.get(parts[k]);
    if (!next) {
      next = { name: parts[k], path: parts.slice(0, k + 1).join('/'), dirs: new Map(), files: [], depth: node.depth + 1 };
      node.dirs.set(parts[k], next);
    }
    node = next;
  }
  node.files.push(f);
}

// ───────────────────────── 건물 종류 ─────────────────────────
const FLOOR = 0.9;  // 한 층 높이
const GAP = 1.3;    // 마당
const TYPES = [
  { key: 'house', name: '주택', icon: '🏠', max: 80, side: 1.9 },
  { key: 'villa', name: '빌라', icon: '🏘️', max: 250, side: 2.5 },
  { key: 'apt', name: '아파트', icon: '🏢', max: 600, side: 2.3, long: 4.6 },
  { key: 'office', name: '오피스', icon: '🏬', max: 1200, side: 3.3 },
  { key: 'tower', name: '마천루', icon: '🏙️', max: Infinity, side: 4.2 },
];
const typeOf = (l) => TYPES.findIndex((t) => l < t.max);
const floorsFor = (l) => (l < 25 ? 1 : l < 80 ? 2 : Math.max(3, Math.round(Math.sqrt(l) * 0.55 - 1)));
function baseDims(f, t) {
  const extra = Math.min(0.8, Math.sqrt(f.fn) * 0.1), T = TYPES[t];
  return T.long ? [T.long + extra, T.side + extra * 0.5] : [T.side + extra, T.side + extra];
}
function dimsFor(f, t) {
  let [a, b] = baseDims(f, t);
  if (a !== b && f.cell.h > f.cell.w) [a, b] = [b, a]; // 아파트는 땅의 긴 방향으로
  return [Math.max(0.6, Math.min(a, f.cell.w - 0.9)), Math.max(0.6, Math.min(b, f.cell.h - 0.9))];
}

// ───────────────────────── 배치 (squarified treemap) ─────────────────────────
// INSET: 구역 둘레 도로 폭의 절반 / PAD: 구역 안쪽 여백
const INSET = (d) => (d === 0 ? 0 : d === 1 ? 1.7 : d === 2 ? 1.0 : 0.35);
const PAD = (d) => (d === 0 ? 2.4 : INSET(d) + 0.55);
const topY = (d) => 0.1 + d * 0.08;

function weigh(node) {
  let sum = 0;
  node.count = node.files.length;
  node.lines = 0;
  for (const f of node.files) {
    const [a, b] = baseDims(f, typeOf(f.l));
    f.w = (a + GAP) * (b + GAP);
    sum += f.w;
    node.lines += f.l;
  }
  for (const d of node.dirs.values()) {
    sum += weigh(d);
    node.count += d.count;
    node.lines += d.lines;
  }
  node.w = (Math.sqrt(sum) + PAD(node.depth) * 2) ** 2;
  return node.w;
}

function squarify(items, rect) {
  const out = new Array(items.length);
  const total = items.reduce((s, it) => s + it.w, 0);
  const scale = (rect.w * rect.h) / total;
  const order = items.map((it, i) => ({ i, a: it.w * scale })).sort((a, b) => b.a - a.a);
  let { x, y, w, h } = rect;
  const worst = (row, len) => {
    let s = 0, mx = 0, mn = Infinity;
    for (const r of row) { s += r.a; mx = Math.max(mx, r.a); mn = Math.min(mn, r.a); }
    return Math.max((len * len * mx) / (s * s), (s * s) / (len * len * mn));
  };
  const place = (row) => {
    const s = row.reduce((t, r) => t + r.a, 0);
    if (w >= h) {
      const cw = s / h;
      let cy = y;
      for (const r of row) { const rh = r.a / cw; out[r.i] = { x, y: cy, w: cw, h: rh }; cy += rh; }
      x += cw; w -= cw;
    } else {
      const rh = s / w;
      let cx = x;
      for (const r of row) { const rw = r.a / rh; out[r.i] = { x: cx, y, w: rw, h: rh }; cx += rw; }
      y += rh; h -= rh;
    }
  };
  let row = [];
  for (const it of order) {
    const len = Math.min(w, h);
    if (!row.length || worst([...row, it], len) <= worst(row, len)) row.push(it);
    else { place(row); row = [it]; }
  }
  if (row.length) place(row);
  return out;
}

const districts = [];
function layout(node, rect, anc) {
  node.di = districts.length;
  const ins = INSET(node.depth);
  districts.push({ node, ...rect, depth: node.depth, vis: { x: rect.x + ins, y: rect.y + ins, w: rect.w - ins * 2, h: rect.h - ins * 2 } });
  const chain = [...anc, node.di];
  const pad = PAD(node.depth);
  const inner = { x: rect.x + pad, y: rect.y + pad, w: Math.max(0.01, rect.w - pad * 2), h: Math.max(0.01, rect.h - pad * 2) };
  const items = [...node.dirs.values(), ...node.files];
  const rects = squarify(items, inner);
  items.forEach((it, k) => {
    const r = rects[k];
    if (it.dirs) { layout(it, r, chain); return; }
    it.cell = r;
    it.x = r.x + r.w / 2;
    it.z = r.y + r.h / 2;
    it.surface = topY(node.depth);
    it.baseY = it.surface + 0.05;
    it.anc = chain;
  });
}

weigh(root);
const S = Math.sqrt(root.w); // 도시 한 변
layout(root, { x: -S / 2, y: -S / 2, w: S, h: S }, []);

// 걷기 충돌·바닥 높이 계산용 격자
const GRID = 8;
const grid = new Map();
for (const f of files) {
  const key = `${Math.floor(f.x / GRID)},${Math.floor(f.z / GRID)}`;
  if (!grid.has(key)) grid.set(key, []);
  grid.get(key).push(f);
}
function nearby(x, z) {
  const gx = Math.floor(x / GRID), gz = Math.floor(z / GRID), out = [];
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) { const c = grid.get(`${gx + a},${gz + b}`); if (c) out.push(...c); }
  return out;
}

// ───────────────────────── 장면 ─────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('#stage').appendChild(renderer.domElement);
$('#boot').remove();

const scene = new THREE.Scene();
scene.background = new THREE.Color();
scene.fog = new THREE.Fog(0xffffff, S * 1.5, S * 4.2);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, S * 30);
camera.position.set(S * 0.55, S * 0.55, S * 0.85);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 3;
controls.maxDistance = S * 4;
const camTarget = new THREE.Vector3(); // 카메라가 바라보는 점 (모든 모드 공통)

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0, 0.35, 0.86);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const hemi = new THREE.HemisphereLight('#ffffff', '#6d7a5a', 1.2);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff3dd', 2.4);
sun.position.set(S * 0.55, S * 1.1, S * 0.35);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -S * 0.75, right: S * 0.75, top: S * 0.75, bottom: -S * 0.75, near: 1, far: S * 4 });
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const ZERO = new THREE.Matrix4().makeScale(0, 0, 0);
const dummy = new THREE.Object3D();
const WHITE = new THREE.Color('#ffffff');
const C = (hex) => new THREE.Color(hex);

const box = new THREE.BoxGeometry(1, 1, 1);
box.translate(0, 0.5, 0);
const roofGeo = (() => {
  const shape = new THREE.Shape([new THREE.Vector2(-0.5, 0), new THREE.Vector2(0.5, 0), new THREE.Vector2(0, 1)]);
  const g = new THREE.ExtrudeGeometry(shape, { depth: 1, bevelEnabled: false });
  g.translate(0, 0, -0.5);
  return g;
})();

function inst(geo, mat, count, { cast = true, receive = true } = {}) {
  const m = new THREE.InstancedMesh(geo, mat, Math.max(1, count));
  m.castShadow = cast;
  m.receiveShadow = receive;
  m.frustumCulled = false;
  m.boundingSphere = new THREE.Sphere(new THREE.Vector3(), S * 3);
  for (let i = 0; i < m.count; i++) { m.setMatrixAt(i, ZERO); m.setColorAt(i, WHITE); }
  scene.add(m);
  return m;
}
function put(mesh, idx, x, y, z, sx, sy, sz, rot = 0) {
  dummy.position.set(x, y, z);
  dummy.rotation.set(0, rot, 0);
  dummy.scale.set(sx, sy, sz);
  dummy.updateMatrix();
  mesh.setMatrixAt(idx, dummy.matrix);
}

// 창문이 있는 외벽 — 층마다 창을 그리고, 밤에는 일부가 켜졌다 꺼졌다 한다
// 켜진 창 비율: 작은 도시 35% → 건물이 많을수록 줄여 큰 프로젝트도 눈부시지 않게 (최저 18%)
const LIT_CUT = (1 - clamp(0.35 - Math.log10(Math.max(1, files.length / 60)) * 0.12, 0.18, 0.35)).toFixed(3);
const U = { uNight: { value: 0 }, uTime: { value: 0 } };

function onRing(r, s, lateral) {
  const { x, y: z, w, h } = r;
  let px, pz, tx, tz, nx, nz;
  if (s < w) { px = x + s; pz = z; tx = 1; tz = 0; nx = 0; nz = 1; }
  else if ((s -= w) < h) { px = x + w; pz = z + s; tx = 0; tz = 1; nx = -1; nz = 0; }
  else if ((s -= h) < w) { px = x + w - s; pz = z + h; tx = -1; tz = 0; nx = 0; nz = -1; }
  else { s -= w; px = x; pz = z + h - s; tx = 0; tz = -1; nx = 1; nz = 0; }

function busFactor(list) {

  if (!owned.length) return null;

  let orphan = 0, k = 0;
  for (const [, n] of [...cnt].sort((a, b) => b[1] - a[1])) { orphan += n; k++; if (orphan > owned.length / 2) break; }

function roleColor(f, role, key) {

function relationsOf(i) {

function roofOf(f, side) {
  const b = f.box || { w: 1, d: 1, h: 0.5 };

function buildArcs() {

}

function weightedPick(list, r) {
  const wt = (x) => x.len * (x.wt ?? (x.main ? 2.5 : 1));

  return list[list.length - 1];

  for (const m of [catBody, catHead, catTail]) m.setColorAt(k, c.c);
  for (const j of [0, 1]) catEar.setColorAt(k * 2 + j, c.c);
  for (let j = 0; j < 4; j++) catLeg.setColorAt(k * 4 + j, c.c);
});

function moveCritters(dt, time) {
  // 새
  birds.forEach((b, k) => {
    const fl = flocks[b.f], a = fl.a + time * fl.w;
    const cx = Math.cos(a) * fl.r, cz = Math.sin(a) * fl.r, y = fl.h + Math.sin(time * 0.7 + b.f) * 1.5;
    const yaw = Math.atan2(-Math.sin(a) * Math.sign(fl.w), Math.cos(a) * Math.sign(fl.w));
    const bx = cx + b.ox + Math.sin(time * 0.9 + b.ph) * 0.4, bz = cz + b.oz + Math.cos(time * 0.8 + b.ph) * 0.4;
    pBase.compose(pPos.set(bx, y + b.oy + Math.sin(time * 2 + b.ph) * 0.2, bz), pQuat.setFromAxisAngle(Y_AXIS, yaw), pScale.setScalar(1));
    birdBody.setMatrixAt(k, pOut.multiplyMatrices(pBase, pLocal.makeScale(0.07, 0.06, 0.17)));
    const flap = Math.sin(time * b.sp + b.ph) * 0.75;
    putPart(birdWing, k * 2, 0.03, 0.01, 0, 0, flap);
    pLocal.makeRotationZ(Math.PI - flap).setPosition(-0.03, 0.01, 0);
    birdWing.setMatrixAt(k * 2 + 1, pOut.multiplyMatrices(pBase, pLocal));
  });
  birdBody.instanceMatrix.needsUpdate = birdWing.instanceMatrix.needsUpdate = true;

  // 고양이: 걷기 ↔ 앉기를 번갈아
  cats.forEach((c, k) => {
    c.timer -= dt;
    if (c.timer <= 0) { c.walking = !c.walking; c.timer = c.walking ? 4 + Math.random() * 6 : 3 + Math.random() * 5; if (c.walking && Math.random() < 0.3) c.dir *= -1; }
    c.sit += ((c.walking ? 0 : 1) - c.sit) * Math.min(1, dt * 4);
    if (c.walking) c.s = (c.s + 0.16 * c.dir * dt + c.ring.len) % c.ring.len;
    const [x, z, tx, tz] = onRing(c.ring, c.s, 0.18);
    const st = c.walking ? time * 7 + c.ph : 0, sit = c.sit;
    pBase.compose(pPos.set(x, c.ring.lvl, z), pQuat.setFromAxisAngle(Y_AXIS, Math.atan2(tx * c.dir, tz * c.dir)), pScale.setScalar(0.42)); // 사람 무릎께
    const by = 0.15 + Math.abs(Math.sin(st)) * 0.01 + sit * 0.02;
    putPart(catBody, k, 0, by + sit * 0.03, -sit * 0.05, -sit * 0.55);
    const hy = by + 0.08 + sit * 0.1, hz = 0.2 - sit * 0.06;
    putPart(catHead, k, 0, hy, hz);
    for (const j of [0, 1]) {
      putPart(catEar, k * 2 + j, (j ? 1 : -1) * 0.045, hy + 0.055, hz - 0.01, 0, (j ? -1 : 1) * 0.25);
      putPart(catEye, k * 2 + j, (j ? 1 : -1) * 0.032, hy + 0.012, hz + 0.075);
    }
    putPart(catTail, k, 0, by + 0.02, -0.19 - sit * 0.02, -0.9 - sit * 0.5 + Math.sin(time * (2 + sit * 2) + c.ph) * 0.15, Math.sin(time * 2.4 + c.ph) * (0.25 + sit * 0.35));
    for (let j = 0; j < 4; j++) {
      const front = j < 2, side = j % 2 ? 0.045 : -0.045, sw = Math.sin(st + (front === (j % 2 === 0) ? 0 : Math.PI)) * 0.5 * (1 - sit);
      const lz = front ? 0.12 - sit * 0.02 : -0.12 + sit * 0.06, ly = (front ? by + sit * 0.05 : by - sit * 0.06) + 0.01;
      putPart(catLeg, k * 4 + j, side, ly, lz, sw - (front ? 0 : sit * 1.3));
    }
  });
  for (const m of [catBody, catHead, catEar, catTail, catLeg, catEye]) m.instanceMatrix.needsUpdate = true;
}

// 🏗️ 공사장 — 커밋 안 된 변경이 있는 파일에 타워 크레인
const YELLOW = new THREE.MeshStandardMaterial({ color: '#f2b705', roughness: 0.6 });
const cranes = files.filter((f) => f.wip).slice(0, 30).map((f, k) => {
  const g = new THREE.Group();
  const mast = new THREE.Mesh(box, YELLOW);
  mast.castShadow = true;
  const pivot = new THREE.Group();
  const jib = new THREE.Mesh(box, YELLOW);
  const counter = new THREE.Mesh(box, plainMat);
  const cable = new THREE.Mesh(box, metalMat);
  const load = new THREE.Mesh(box, new THREE.MeshStandardMaterial({ color: '#8b5a2b' }));
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), beaconMat);
  for (const m of [jib, counter, load]) m.castShadow = true;
  pivot.add(jib, counter, cable, load, tip);
  g.add(mast, pivot);
  scene.add(g);
  const mx = f.x + (f.cell.w / 2 - 0.55) * (k % 2 ? 1 : -1), mz = f.z + (f.cell.h / 2 - 0.55) * (k % 3 ? 1 : -1);
  return { f, g, mast, pivot, jib, counter, cable, load, tip, mx, mz, speed: 0.25 + (k % 5) * 0.08, phase: k };
});
function moveCranes(time) {
  for (const c of cranes) {
    const h = (c.f.box ? c.f.box.h : 0) + 3.2, L = Math.max(4, (c.f.cell.w + c.f.cell.h) * 0.45);
    c.g.position.set(c.mx, c.f.baseY, c.mz);
    c.mast.scale.set(0.32, h, 0.32);
    c.pivot.position.y = h;
    c.jib.scale.set(L, 0.3, 0.3); c.jib.position.x = L / 2 - 0.4;
    c.counter.scale.set(1.2, 0.5, 0.55); c.counter.position.x = -1.2;
    const reach = L * (0.55 + 0.25 * Math.sin(time * 0.4 + c.phase)), drop = 1.5 + (h - 2) * (0.5 + 0.4 * Math.sin(time * 0.6 + c.phase));
    c.cable.scale.set(0.04, drop, 0.04); c.cable.position.set(reach, -drop, 0);
    c.load.scale.set(0.7, 0.4, 0.7); c.load.position.set(reach, -drop - 0.4, 0);
    c.tip.position.set(L - 0.4, 0.3, 0);
    c.pivot.rotation.y = time * c.speed + c.phase;
    c.tip.visible = Math.sin(time * 4 + c.phase) > 0;
  }
}

const cloudMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1, flatShading: true, transparent: true, opacity: 0.92 });

const clouds = Array.from({ length: Math.max(6, Math.round(S / 14)) }, (_, k) => {

});
const starGeo = new THREE.BufferGeometry();

for (let k = 0; k < 900; k++) {

}

const SKY = {
  bg: ['#a9cdea', '#f0a77a', '#070b16'].map(C),
  sun: ['#fff3dd', '#ffb070', '#9db4ff'].map(C),
  hemiSky: ['#ffffff', '#ffd2b0', '#4a5c90'].map(C),
  grass: ['#7ea35f', '#6f8a52', '#0f1a12'].map(C),
};
const SKY_MODES = { auto: '🌗 자동', day: '☀️ 낮', night: '🌙 밤' };
const skyHash = new URLSearchParams(location.hash.slice(1)).get('sky');
let skyMode = SKY_MODES[skyHash] ? skyHash : SKY_MODES[store.get('cc-sky')] ? store.get('cc-sky') : 'auto';
// 하늘의 시각(0~24시): 자동이면 PC 시계, 낮 고정은 13시, 밤 고정은 23시. 바꾸면 그 시각까지 하늘이 부드럽게 돈다
function hourTarget() {
  if (skyMode === 'day') return 13;
  if (skyMode === 'night') return 23;
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
}
const nightOf = (h) => (h < 5 ? 1 : h < 6.5 ? 1 - (h - 5) / 1.5 : h < 17.5 ? 0 : h < 19 ? (h - 17.5) / 1.5 : 1);
let skyHour = hourTarget();
let night = nightOf(skyHour);
function stepSkyHour(dt) {
  const d = ((hourTarget() - skyHour + 36) % 24) - 12; // 가까운 쪽으로 (자정을 넘어가도)
  skyHour = (skyHour + d * Math.min(1, dt * 1.2) + 24) % 24;
  night = nightOf(skyHour);
}

// ☀️ 해 · 🌙 달 — 해는 6시에 동쪽(+x)에서 떠 12시에 가장 높고 18시에 서쪽으로, 달은 18시~6시에 같은 길을 간다
const SKY_R = S * 5;
const glowTex = (inner, outer) => {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, inner); gr.addColorStop(0.32, inner); gr.addColorStop(0.36, outer); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
};
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex('#fff8e0', 'rgba(255,214,140,0.45)'), fog: false, depthWrite: false, transparent: true }));
const moonSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex('#eef1ff', 'rgba(170,190,255,0.25)'), fog: false, depthWrite: false, transparent: true }));
sunSprite.scale.setScalar(S * 0.9);
moonSprite.scale.setScalar(S * 0.6);
scene.add(sunSprite, moonSprite);
// 하늘 위 방향: t = 0(뜰 때) → 0.5(가장 높이) → 1(질 때)
const arcDir = (t, side) => new THREE.Vector3(Math.cos(t * Math.PI), Math.sin(t * Math.PI) * 0.9, side).normalize();
const lightDir = new THREE.Vector3();
function placeSunMoon() {
  const h = skyHour, ts = (h - 6) / 12, tm = (((h - 18) + 24) % 24) / 12;
  const sd = arcDir(ts, 0.42), md = arcDir(tm, -0.3);
  sunSprite.position.copy(sd).multiplyScalar(SKY_R);
  moonSprite.position.copy(md).multiplyScalar(SKY_R);
  sunSprite.visible = ts > -0.04 && ts < 1.04;
  moonSprite.visible = tm > -0.04 && tm < 1.04;
  sunSprite.material.opacity = clamp01(sd.y * 6 + 0.3);
  moonSprite.material.opacity = clamp01(md.y * 6 + 0.3) * clamp01(night * 1.5);
  // 빛은 떠 있는 쪽에서 — 너무 낮으면 그림자가 도시 밖까지 길어지므로 높이를 받친다
  lightDir.copy(ts >= 0 && ts <= 1 ? sd : md);
  lightDir.y = Math.max(lightDir.y, 0.38);
  lightDir.normalize();
  sun.position.copy(lightDir).multiplyScalar(S * 1.3);
}
function renderSkyBtn() { $('#skyBtn').textContent = SKY_MODES[skyMode]; }
function cycleSky() {
  skyMode = { auto: 'day', day: 'night', night: 'auto' }[skyMode];
  store.set('cc-sky', skyMode);
  renderSkyBtn();
}
$('#skyBtn').addEventListener('click', cycleSky);
renderSkyBtn();

function applySky(time) {
  const n = night;
  scene.background.copy(ramp(SKY.bg, n));
  scene.fog.color.copy(scene.background);
  sun.color.copy(ramp(SKY.sun, n));
  sun.intensity = 2.5 - n * 2.1;
  placeSunMoon();
  hemi.color.copy(ramp(SKY.hemiSky, n));
  hemi.intensity = 1.2 - n * 0.85;
  ground.material.color.copy(ramp(SKY.grass, n));
  U.uNight.value = n;
  U.uTime.value = time;
  bloom.strength = n * 0.45;
  cloudMat.opacity = 0.92 * (1 - n * 0.85);
  starMat.opacity = clamp01((n - 0.5) * 2);
  const glow = 0.8 + n * 0.75;
  lampMat.color.setRGB(1 * glow, 0.8 * glow, 0.52 * glow);
  headMat.color.setRGB(1 * glow, 0.95 * glow, 0.8 * glow);
  tailMat.color.setRGB(1 * (0.7 + n), 0.15, 0.12);
  const on = Math.sin(time * 2.6) > 0.55 ? 1 : 0.12;
  beaconMat.color.setRGB((0.5 + n * 2.2) * on, 0.08 * on, 0.06 * on);
}

    ibox(inRoot, 2.8, 0.05, 0.85, IMAT.top, rx, 1.0, rz);
    ibox(inRoot, 0.5, 0.32, 0.04, IMAT.dark, rx + 0.6, 1.05, rz - 0.1);
    ibox(inRoot, 0.18, 0.04, 0.14, IM('#d9b46a', { metalness: 0.8, roughness: 0.3 }), rx - 0.7, 1.05, rz + 0.15);
    FL.boxes.push([rx - 1.4, rx + 1.4, rz - 0.45, rz + 0.45]);
    FL.inter.push({ box: [rx - 1.4, rx + 1.4, rz - 0.45, rz + 0.45], r: 1.0, prompt: `<kbd>E</kbd> 🛎 <b>안내 데스크</b> <span style="color:var(--muted);font-weight:500">· 건물 소개 · 층별 안내</span>`, act: toggleBoard });
    const recep = makeWorker(f.i * 7 + 3);
    recep.position.set(rx, 0, rz - 0.75);
    inRoot.add(recep);
    FL.workers.push({ g: recep, mode: 'stand' });
    // 로비 소파 · 화분
    placeDecor('sofa', W / 4, D / 2 - 2.4, Math.PI);
    placeDecor('plant', W / 2 - 0.8, D / 2 - 0.8, 0);
    placeDecor('plant', -W / 2 + 0.8, D / 2 - 0.8, 0);
  }

  // 칸 나누기: 통로(x=0) 양옆으로 행 · 열
  const cells = [];
  for (let row = 0; row < rows(); row++) for (const side of [-1, 1]) for (let c = 0; c < cols(); c++) {
    cells.push({ x: side * (AISLE / 2 + 0.5 + CELL * (c + 0.5)), z: z0 + CELL * (row + 0.5), side, row, c, used: false });
  }
  const cellAt = (side, row, c) => cells.find((q) => q.side === side && q.row === row && q.c === c);
  // 요소 놓기
  for (const it of floorIt) {
    let x, z, side;
    if (it.kind === 'class') { // 같은 열 위아래 두 칸
      const a = cells.find((q) => !q.used && cellAt(q.side, q.row + 1, q.c) && !cellAt(q.side, q.row + 1, q.c).used && q.row % 2 === 0)
        || cells.find((q) => !q.used && cellAt(q.side, q.row + 1, q.c) && !cellAt(q.side, q.row + 1, q.c).used);
      if (!a) continue;
      const b = cellAt(a.side, a.row + 1, a.c);
      a.used = b.used = true;
      x = a.x; z = (a.z + b.z) / 2; side = a.side;
    } else {
      const a = cells.find((q) => !q.used);
      if (!a) continue;
      a.used = true;
      x = a.x; z = a.z; side = a.side;
    }
    placeItem(it, x, z, -side * Math.PI / 2); // 통로(x=0) 쪽을 본다
  }
  // 벽 요소: 양옆 벽
  let slot = 0;
  for (const it of wallIt) {
    const side = slot % 2 ? 1 : -1, k = Math.floor(slot / 2);
    const z = z0 + 0.6 + k * 1.7;
    if (z > zFront) break;
    placeItem(it, side * (W / 2 - 0.2), z, side > 0 ? -Math.PI / 2 : Math.PI / 2, true);
    slot++;
  }
  // 남은 칸에 장식
  for (let k = 0; k < nDecor; k++) {
    const free = cells.filter((q) => !q.used);
    if (!free.length) break;
    const q = free[Math.floor(r() * free.length)];
    q.used = true;
    placeDecor(DECOR_KINDS[Math.floor(r() * DECOR_KINDS.length)], q.x, q.z, q.side > 0 ? -Math.PI / 2 : Math.PI / 2);
  }
  placeDecor('plant', -W / 2 + 0.7, -D / 2 + 3.0, 0);
  placeDecor('cooler', W / 2 - 0.6, zFront - 0.2, 0);

  // 사람: 낮 · 최근 활동이 많을수록 북적인다
  const busy = clamp((1 - night * 0.85) * (0.25 + Math.min(0.45, f.r90 * 0.06) + (f.wip ? 0.2 : 0)), 0, 0.92);
  inRoot.children.filter((g) => g.userData.seat).forEach((g, k) => {
    if (r() > busy) return;
    const w = makeWorker(f.i * 131 + fl * 17 + k), [lx, ly, lz] = g.userData.seat;
    const p = new THREE.Vector3(lx, 0, lz).applyAxisAngle(Y_AXIS, g.rotation.y).add(g.position);
    w.position.set(p.x, ly - BODY.hipY * w.scale.y + 0.02, p.z);
    w.rotation.y = g.rotation.y + Math.PI;
    inRoot.add(w);
    FL.workers.push({ g: w, mode: 'sit' });
  });
  for (let k = 0; k < Math.round(busy * 2.5); k++) {
    const w = makeWorker(f.i * 71 + fl * 13 + k * 5);
    const zA = z0 + 0.5, zB = zFront - 0.3;
    w.position.set((r() - 0.5) * (AISLE - 0.6), 0, zA + r() * (zB - zA));
    inRoot.add(w);
    FL.workers.push({ g: w, mode: 'walk', zA, zB, dir: r() < 0.5 ? 1 : -1, pause: 0, speed: 0.6 + r() * 0.4 });
  }
  $('#inFloor').textContent = `${fl}F / ${insideFloors}F`;
  updateInteriorLight();
}
// 요소 하나 (그룹 + 충돌 + 상호작용 + 이름표)
function placeItem(it, x, z, ry, onWall) {
  const g = new THREE.Group();
  const dims = PIECES[PIECE_OF[it.kind] || 'fn'](g, it);
  g.position.set(x, 0, z);
  g.rotation.y = ry;
  g.userData.item = it;
  const side = onWall ? (x < 0 ? 'left' : 'right') : null;
  (side ? FL.sides[side] : inRoot).add(g); // 벽에 건 것은 벽과 함께 잘린다
  if (g.userData.spin) FL.spin.push(g.userData.spin);
  const front = new THREE.Vector3(0, 0, 1).applyAxisAngle(Y_AXIS, ry);
  let box = null;
  if (dims) {
    const [w, d] = Math.abs(Math.sin(ry)) > 0.5 ? [dims[1], dims[0]] : dims;
    box = [x - w / 2, x + w / 2, z - d / 2, z + d / 2];
    FL.boxes.push(box);

  const lines = it.end - it.line + 1;
  FL.inter.push({
    ...(box ? { box, r: 0.9 } : { x: x + front.x * 0.7, z: z + front.z * 0.7, r: 1.2 }),
    item: it,
    prompt: `<kbd>E</kbd> ${KIND_ICON2[it.kind] || 'ƒ'} <b>${esc(it.name)}</b> 코드 보기 <span style="color:var(--muted);font-weight:500">· ${KIND_NAME[it.kind] || ''} ${lines}줄</span>`,
    act: () => openCode(it),

  const el = document.createElement('div');
  el.className = `in-label k-${it.kind}`;
  el.innerHTML = `<i>${KIND_ICON2[it.kind] || 'ƒ'}</i>${esc(it.name)}`;
  $('#inLabels').appendChild(el);
  FL.labels.push({ el, side, pos: new THREE.Vector3(x, (g.userData.label || 1.55), z).addScaledVector(front, onWall ? 0.2 : 0) });
}
function placeDecor(kind, x, z, ry) {
  const g = new THREE.Group();
  const dims = DECOR[kind](g);
  g.position.set(x, 0, z);
  g.rotation.y = ry;
  inRoot.add(g);
  if (dims) {

}

const LINE_H = 20;
// 하이라이트된 HTML 을 줄 단위로 자른다 — 여러 줄에 걸친 <span>(주석 · 문자열)은 줄마다 닫았다 다시 연다
function splitHtmlLines(html) {
  const out = [], open = [];
  let cur = '';
  for (const tok of html.match(/<span[^>]*>|<\/span>|\n|[^<\n]+|</g) || []) {
    if (tok === '\n') { out.push(cur + '</span>'.repeat(open.length)); cur = open.join(''); }
    else if (tok.startsWith('<span')) { open.push(tok); cur += tok; }
    else if (tok === '</span>') { open.pop(); cur += tok; }
    else cur += tok;
  }
  out.push(cur + '</span>'.repeat(open.length));
  return out;
}
// 접을 수 있는 블록: 다음 줄부터 들여쓰기가 더 깊은 줄들 (닫는 괄호 줄은 남긴다). foldEnd[줄] = 블록 마지막 줄
function foldRanges(lines) {
  const n = lines.length, ind = new Int32Array(n + 2).fill(-1), end = new Int32Array(n + 2);
  for (let i = 1; i <= n; i++) {
    const l = lines[i - 1];
    if (/\S/.test(l)) ind[i] = l.match(/^[ \t]*/)[0].replace(/\t/g, '    ').length;
  }
  for (let i = 1; i <= n; i++) {
    if (ind[i] < 0) continue;
    let j = i + 1;
    while (j <= n && ind[j] < 0) j++;
    if (j > n || ind[j] <= ind[i]) continue;
    let last = j;
    for (let k = j + 1; k <= n; k++) {
      if (ind[k] < 0) continue;
      if (ind[k] > ind[i]) last = k; else break;
    }
    if (last - i >= 2) end[i] = last;
  }
  return end;
}
const code = { rows: [], end: null, folded: new Set(), visible: [], start: 1 };
// start: 화면에 보일 첫 줄 번호 (요소 한 부분만 보여 줄 때)
function renderCode(text, lang, hljs, start = 1) {
  text = text.replace(/\r\n?/g, '\n'); // 윈도우 줄바꿈의 \r 이 줄 끝에 남지 않게
  const lines = text.split('\n'), n = lines.length;
  let html = esc(text);
  const hl = HL_LANG[lang];
  if (hljs && hl && hljs.getLanguage(hl) && text.length < 600000) {
    try { html = hljs.highlight(text, { language: hl, ignoreIllegals: true }).value; } catch {}
  }
  const htmlLines = splitHtmlLines(html);
  code.end = foldRanges(lines);
  code.folded = new Set();
  code.start = start;
  const gw = `${String(n + start - 1).length * 7.6 + 34}px`;
  $('#scroller').innerHTML = `<div class="code hljs" style="--gw:${gw}">${htmlLines.map((h, k) => {
    const i = k + 1, e = code.end[i];
    return `<div class="ln" data-n="${i}"><span class="g">${e ? `<button class="fd" data-fold="${i}" title="${e - i}줄 접기">▾</button>` : ''}${i + start - 1}</span><span class="c">${h || ' '}</span></div>`;
  }).join('')}</div>`;
  code.rows = [...$('#scroller').querySelectorAll('.ln')];
  applyFolds();
  $('#scroller').scrollTop = 0;
}
function applyFolds() {
  const vis = [];
  let hideTo = 0;
  code.rows.forEach((row, k) => {
    const i = k + 1, hidden = i <= hideTo, folded = !hidden && code.folded.has(i);
    row.classList.toggle('hid', hidden);
    row.classList.toggle('folded', folded);
    const more = row.querySelector('.fold-more');
    if (folded && !more) row.querySelector('.c').insertAdjacentHTML('beforeend', `<button class="fold-more" data-fold="${i}">⋯ ${code.end[i] - i}줄</button>`);
    else if (!folded && more) more.remove();
    if (folded) hideTo = Math.max(hideTo, code.end[i]);
    if (!hidden) vis.push(i);
  });
  code.visible = vis;
}
function toggleFold(i) {
  if (code.folded.has(i)) code.folded.delete(i); else code.folded.add(i);
  applyFolds();
}
$('#scroller').addEventListener('click', (e) => {
  const b = e.target.closest('[data-fold]');
  if (b) toggleFold(+b.dataset.fold);
});
$('#foldAll').addEventListener('click', () => {
  code.folded = new Set(code.rows.map((_, k) => k + 1).filter((i) => code.end[i]));
  applyFolds();
});
$('#unfoldAll').addEventListener('click', () => { code.folded.clear(); applyFolds(); });
function gotoLine(abs) {
  const line = abs - code.start + 1;
  // 접힌 블록 안이면 펼친다
  let changed = false;
  for (const s of code.folded) if (s < line && line <= code.end[s]) { code.folded.delete(s); changed = true; }
  if (changed) applyFolds();
  const sc = $('#scroller'), row = code.rows[line - 1];
  if (!row) return;
  sc.scrollTo({ top: Math.max(0, row.offsetTop - sc.clientHeight * 0.3), behavior: 'smooth' });
  sc.querySelector('.hl')?.remove();
  const mark = document.createElement('div');
  mark.className = 'hl';
  mark.style.top = `${row.offsetTop}px`;
  sc.querySelector('.code')?.appendChild(mark);
}
// 안내판: 층별 안내를 누르면 그 층으로 가서 코드를 연다 · 연결된 건물로 바로 이동
$('#board').addEventListener('click', async (e) => {
  if (e.target.closest('#boardClose')) { $('#board').classList.remove('open'); return; }
  const it = e.target.closest('[data-line]');
  if (it) {
    const line = +it.dataset.line, fl = floorOfLine(line);
    $('#board').classList.remove('open'); // 안내판은 닫고 그 층으로
    if (fl !== FL.n) await travelTo(fl, 'elev');
    openCode(insideOutline.find((o) => o.line === line) || itemsOnFloor(fl)[0]);
    return;
  }
  const go = e.target.closest('[data-go]');
  if (go) exclusive(async () => { // 연결된 건물로 바로 이동 (엘리베이터처럼 짧게 암전)
    walk.ready = false;
    await fade(1);
    await showInside(files[+go.dataset.go]);
    await fade(0);
    walk.ready = true;
  });
});
$('#inOpen').addEventListener('click', () => insideFile && BRIDGE?.openFile(insideFile.p));
$('#inExit').addEventListener('click', () => exitBuilding());
// 층 안에서 물건을 클릭해도 코드가 열린다
renderer.domElement.addEventListener('pointerup', (e) => {
  if (mode !== 'inside' || !down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5 || e.button !== 0) return;
  raycaster.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  for (const hit of raycaster.intersectObject(inRoot, true)) {
    let o = hit.object;
    while (o && !o.userData.item) o = o.parent;
    if (o) { openCode(o.userData.item); return; }
  }
});

const exitBuilding = (...a) => exclusive(() => exitBuildingNow(...a));
async function exitBuildingNow() {
  if (mode !== 'inside') return;
  walk.ready = false;
  walk.keys.clear();
  await fade(1);
  const f = insideFile;
  closeCode();
  closeElevator();
  $('#board').classList.remove('open');
  for (const l of FL.labels) l.el.remove();
  FL.labels = [];
  disposeTree(inRoot);
  inRoot.clear();
  inScene.remove(avatar);
  scene.add(avatar);
  world = CITY;
  walk.scale = SCALE_CITY;
  walk.v = 0;
  avatar.scale.setScalar(SCALE_CITY);
  $('#inside').hidden = true;
  $('#prompt').classList.remove('on');
  document.body.classList.remove('inside');
  insideFile = null;
  mode = insideFrom;
  if (mode === 'orbit') {
    avatar.visible = false;
    $('#walkHud').hidden = true;
    camera.position.copy(savedView.pos);
    camTarget.copy(savedView.tgt);
    camera.lookAt(camTarget);
    controls.target.copy(camTarget);
    controls.enabled = true;
    controls.update();
  } else {
    // 나온 건물 문 앞에서 거리 쪽을 보고 선다
    const b = f.box, out = [f.x + f.fx * (b.w / 2 + 0.9), f.z + f.fz * (b.d / 2 + 0.9)];
    let spot = !blocked(out[0], out[1]) ? [out[0], out[1], f.fx, f.fz] : null;
    for (const [dx, dz] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
      if (spot) break;
      const x = f.x + dx * (b.w / 2 + 0.7), z = f.z + dz * (b.d / 2 + 0.7);
      if (!blocked(x, z)) spot = [x, z, dx, dz];
    }
    if (spot) { walk.pos.set(spot[0], groundAt(spot[0], spot[1]), spot[1]); walk.heading = Math.atan2(spot[2], spot[3]); walk.yaw = walk.heading + Math.PI; }
    avatar.position.copy(walk.pos);
    const { pos, look } = walkCamDesired();
    camera.position.copy(pos);
    camTarget.copy(look);
    camera.lookAt(camTarget);
    walk.near = undefined;
  }
  await fade(0);
  if (mode === 'walk') walk.ready = true;
  if (mode === 'orbit') select(f.i, true);
}

// 층 안의 움직임: 진열장 장식이 돌고, 사람은 앉아 타자 치거나 통로를 오가고, 이름표는 가까운 것만
function updateInterior(dt, time) {
  // 카메라 쪽 벽은 낮게 잘라(심즈식) 안이 보이게, 나머지는 원래 높이로
  const cam = camera.position, mg = 0.3;
  const cut = { back: cam.z < -FL.D / 2 + mg, front: cam.z > FL.D / 2 - mg, left: cam.x < -FL.W / 2 + mg, right: cam.x > FL.W / 2 - mg };
  for (const k in FL.sides) { const g = FL.sides[k]; g.scale.y += ((cut[k] ? 0.12 : 1) - g.scale.y) * Math.min(1, dt * 8); }
  for (const g of FL.spin) g.rotation.y += dt * 1.2;
  for (const w of FL.workers) {
    const g = w.g, ud = g.userData, ph = ud.phase;
    if (w.mode === 'sit') {
      for (const l of ud.legs) l.rotation.x = -1.45;
      ud.arms.forEach((a, k) => (a.rotation.x = -1.05 + Math.sin(time * 11 + ph + k * 1.7) * 0.07));
      ud.body.position.y = Math.sin(time * 1.6 + ph) * 0.004;
    } else if (w.mode === 'stand') {
      ud.body.scale.y = 1 + Math.sin(time * 2 + ph) * 0.012;
    } else {
      if (w.pause > 0) { w.pause -= dt; ud.legs.forEach((l) => (l.rotation.x *= 0.8)); continue; }
      g.position.z += w.dir * w.speed * dt;
      if (g.position.z > w.zB || g.position.z < w.zA) { w.dir *= -1; w.pause = 1 + Math.random() * 2.5; }
      g.rotation.y = w.dir > 0 ? 0 : Math.PI;
      const s = Math.sin(time * 7 * w.speed + ph) * 0.55;
      ud.legs[0].rotation.x = s; ud.legs[1].rotation.x = -s;
      ud.arms[0].rotation.x = -s * 0.7; ud.arms[1].rotation.x = s * 0.7;
      ud.body.position.y = Math.abs(Math.cos(time * 7 * w.speed + ph)) * 0.03;
      ud.body.rotation.z = Math.sin(time * 7 * w.speed + ph) * 0.07;
    }
  }
  for (const { el, pos, side } of FL.labels) {
    if (side && cut[side]) { el.style.opacity = 0; continue; }
    tmpV.copy(pos).project(camera);
    const d = camera.position.distanceTo(pos), dw = walk.pos.distanceTo(pos);
    const show = tmpV.z < 1 && Math.abs(tmpV.x) < 1.05 && Math.abs(tmpV.y) < 1.05 && dw < 7.5;
    el.style.opacity = show ? clamp01((7.5 - dw) / 2.5) : 0;
    if (show) { el.style.left = `${(tmpV.x * 0.5 + 0.5) * innerWidth}px`; el.style.top = `${(-tmpV.y * 0.5 + 0.5) * innerHeight}px`; el.style.zIndex = String(1000 - Math.round(d * 10)); }
  }
}


// ───────────────────────── 키보드 ─────────────────────────
const WALK_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ShiftLeft', 'ShiftRight']);
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.repeat && (e.code === 'KeyE' || e.key === 'Escape')) return;
  if (mode === 'inside') {
    const panelOpen = $('#elevPanel').classList.contains('open');
    if (WALK_KEYS.has(e.code) && !panelOpen) { walk.keys.add(e.code); e.preventDefault(); }
    if (e.code === 'KeyE' && walk.near && walk.ready && !panelOpen) world.act(walk.near);
    if (e.code === 'KeyV' && !e.repeat) setView(!walk.fp);
    if (e.key === 'Escape') { // 열린 것부터 하나씩 닫고, 다 닫혀 있으면 건물 밖으로
      if (panelOpen) closeElevator();
      else if ($('#monitor').classList.contains('open')) closeCode();
      else if ($('#board').classList.contains('open')) $('#board').classList.remove('open');
      else exitBuilding();
    }
    return;
  }
  if (mode === 'walk') {
    if (WALK_KEYS.has(e.code)) { walk.keys.add(e.code); e.preventDefault(); }
    if (e.code === 'KeyE' && walk.near && walk.ready) world.act(walk.near);
    if (e.key === 'Escape') stopWalk();
    if (e.code === 'KeyN') cycleSky();
    if (e.code === 'KeyL') setLabels(!labelsOn);
    if (e.code === 'KeyV' && !e.repeat) setView(!walk.fp);
    return;
  }
  if (e.code === 'Space' && HAS_GIT) { e.preventDefault(); setPlaying(!state.playing); }
  if (e.key === 'Escape') select(-1);
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  if (e.code === 'KeyN') cycleSky();
  if (e.code === 'KeyL') setLabels(!labelsOn);
});
addEventListener('keyup', (e) => walk.keys.delete(e.code));
addEventListener('blur', () => walk.keys.clear());

// ───────────────────────── 시작 ─────────────────────────
const CAM_KEY = `cc-cam-${DATA.root}`;
// 보던 상태도 함께 남긴다 — 앱이 커밋 · 수정을 보고 도시를 다시 그릴 때(#live) 걷기 · 건물 안 · 열어 둔 코드로 돌아오게
const VIEW_KEY = `cc-view-${DATA.root}`;
setInterval(() => {
  if (mode === 'orbit') store.set(CAM_KEY, JSON.stringify([...camera.position.toArray(), ...controls.target.toArray()]), true);
  if (busy) return;
  store.set(VIEW_KEY, JSON.stringify({
    mode, from: insideFrom, sel: state.selected >= 0 ? files[state.selected].p : null,
    walk: [walk.pos.x, walk.pos.z, walk.heading],
    inside: mode === 'inside' && insideFile ? { p: insideFile.p, fl: FL.n, code: openItem?.line ?? null } : null,
  }), true);
}, 1000);
async function restoreView() {
  let v = null;
  try { v = JSON.parse(store.get(VIEW_KEY)); } catch {}
  if (!v) return;
  const byPath = (p) => files.find((f) => f.p === p);
  const backToWalk = v.mode === 'walk' || (v.mode === 'inside' && v.from === 'walk');
  if (backToWalk) {
    await startWalk();
    if (v.mode === 'walk' && !blocked(v.walk[0], v.walk[1])) {
      walk.pos.set(v.walk[0], groundAt(v.walk[0], v.walk[1]), v.walk[1]);
      walk.heading = v.walk[2];
      walk.yaw = walk.heading + Math.PI;
    }
  } else if (v.sel) { const f = byPath(v.sel); if (f) select(f.i); }
  const f = v.inside && byPath(v.inside.p);
  if (f && f.box) {
    await enterBuilding(f);
    if (v.inside.fl > 1) await travelTo(Math.min(v.inside.fl, insideFloors), 'elev');
    if (!INSIDE.blocked(v.walk[0], v.walk[1])) placeAvatarInside(v.walk[0], v.walk[1], v.walk[2]);
    const it = v.inside.code != null && insideOutline.find((o) => o.line === v.inside.code);
    if (it) openCode(it);
  }
}

// 주소 해시: #mode=claude&time=120&select=gamePage&play=1&live=1&sky=night
const hash = new URLSearchParams(location.hash.slice(1));
const wantColor = hash.get('mode') || store.get('cc-mode');
if (MODES[wantColor] && (HAS_GIT || !MODES[wantColor].git)) state.color = wantColor;
if (HAS_GIT && hash.has('time')) state.time = Math.max(0, Math.min(N, +hash.get('time') || 0));
const live = hash.has('live');
if (live) {
  try {
    const cam = JSON.parse(store.get(CAM_KEY));
    if (cam) { camera.position.fromArray(cam, 0); controls.target.fromArray(cam, 3); }
  } catch {}
}
controls.update();
camTarget.copy(controls.target);
renderModes();
applyTime();

// 처음엔 중심에서 바깥으로 도시가 지어진다 (실시간 갱신 땐 생략)
const introDelay = new Float32Array(files.length);
for (const f of files) introDelay[f.i] = (Math.hypot(f.x, f.z) / (S * 0.72)) * 1.1;
let intro = live ? null : 0;
if (live) {
  for (const f of files) { curL[f.i] = tgtL[f.i]; placeBuilding(f, curL[f.i]); }
  flushBuildings();
}
if (hash.has('select')) {
  const q = hash.get('select').toLowerCase();
  const f = files.find((f) => f.p.toLowerCase().includes(q));
  if (f) {
    if (hash.has('enter')) { curL[f.i] = tgtL[f.i]; placeBuilding(f, f.l); enterBuilding(f); }
    else select(f.i, true);
  }
}
if (hash.has('walk')) setTimeout(startWalk, 2200);
else if (live) restoreView();
if (HAS_GIT && hash.get('play') === '1' && state.time < N) setPlaying(true);
if (hash.get('toast')) toast(hash.get('toast'));

const selBox = new THREE.LineSegments(new THREE.EdgesGeometry(box), new THREE.LineBasicMaterial({ color: '#ffffff' }));
const pin = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.2, 4), new THREE.MeshBasicMaterial({ color: '#ff5a5a' }));
pin.rotation.x = Math.PI;
selBox.visible = pin.visible = false;
scene.add(selBox, pin);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  if (mode === 'inside') {
    stepSkyHour(dt);
    if (insideFile) { updateWalk(dt, time); updateInterior(dt, time); }
    renderer.render(inScene, camera);
    return;
  }

  if (state.playing) {
    state.t += dt * state.speed;
    if (state.t >= N) { setTime(N); setPlaying(false); }
    else setTime(Math.floor(state.t));
  }

  let moved = false;
  if (intro !== null) {
    let done = true;
    for (const f of files) {
      const p = clamp01((time - introDelay[f.i]) / 0.8);
      if (p < 1) done = false;
      const l = tgtL[f.i] * (1 - (1 - p) ** 3);
      if (l !== curL[f.i]) { curL[f.i] = l; placeBuilding(f, l); moved = true; }
    }
    if (done) intro = null;
  } else {
    const k = Math.min(1, dt * 7);
    for (const f of files) {
      const d = tgtL[f.i] - curL[f.i];
      if (!d) continue;
      curL[f.i] = Math.abs(d) < 0.5 ? tgtL[f.i] : curL[f.i] + d * k;
      placeBuilding(f, curL[f.i]);
      moved = true;
    }
  }
  if (moved) { flushBuildings(); if (rel && time - (arcBuiltAt || 0) > 0.3) { buildArcs(); arcBuiltAt = time; } }
  if (colorsDirty) updateColors();

  stepSkyHour(dt);
  applySky(time);
  moveStreets(dt, time);
  moveCritters(dt, time);
  moveArcs(time);
  updateSignals(time);
  moveCranes(time);
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > S * 1.3) c.position.x = -S * 1.3;
  }

  const sel = mode === 'orbit' && state.selected >= 0 && files[state.selected].box;
  selBox.visible = pin.visible = !!sel;
  if (sel) {
    const f = files[state.selected], b = f.box;
    selBox.position.set(f.x, f.baseY, f.z);
    selBox.scale.set(b.w * 1.05, b.h * 1.01, b.d * 1.05);
    pin.position.set(f.x, f.baseY + b.h + 1.6 + Math.sin(time * 3) * 0.3, f.z);
    pin.rotation.y = time;
  }

  if (mode === 'walk') updateWalk(dt, time);
  if (tween) stepTween(dt);
  else if (mode === 'orbit') { controls.update(); camTarget.copy(controls.target); }

  if (mode === 'orbit' && (mouseDirty || moved || tween)) { pick(); mouseDirty = false; }
  if (night > 0.03) composer.render(); else renderer.render(scene, camera);
  if (shotPending) saveShot();
  updateLabels();
});

// 📸 지금 화면 저장 — 그린 직후(같은 프레임)에 캔버스를 PNG 로 받는다
let shotPending = false;
$('#shotBtn').addEventListener('click', () => { shotPending = true; });
function saveShot() {
  shotPending = false;
  renderer.domElement.toBlob((blob) => {
    if (!blob) return;
    const a = document.createElement('a'), d = new Date(), p = (n) => String(n).padStart(2, '0');
    a.href = URL.createObjectURL(blob);
    a.download = `${DATA.name}-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('📸 화면을 저장했어요');
  }, 'image/png');
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
